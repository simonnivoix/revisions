// Contenu du mode focus plein écran (session en cours).
function focusCard(){
  const a=data.active, m=matById(a.mat);
  const name=m?escapeH(m.nom):'Matière supprimée';
  const col=m?m.color:'var(--muted)';
  const wrap=inner=>`<div class="focuswrap" style="--c:${col}">
    <div class="runtop"><span class="rdot"></span><span class="rname">${name}</span></div>${inner}</div>`;
  const stop=`<button class="bigbtn bigstop" onclick="stopSession()">${ic('stop',20)}<span>Terminer</span></button>`;
  const prog = a.goal ? `<div class="rgoal"><div class="rgbar"><i id="rgfill"></i></div><span class="rglab" id="rglab"></span></div>` : '';
  const more=`<button class="bigbtn bigsec" onclick="continueSession()">${ic('play',18)}<span>Continuer</span></button>`;
  const plan = (a.plan&&a.plan.length) ? `<ul class="focusplan">${a.plan.map(p=>`<li>${escapeH(p.txt)}</li>`).join('')}</ul>` : '';   // juste un rappel : on coche au bilan
  if(!ownSession){   // session pilotée par un autre onglet : affichage seul, aucun bouton qui écrirait une 2e copie
    const idle = a.mode==='pomo' && (a.phase==='ready'||a.phase==='done');
    const ph = a.mode==='pomo' ? `<p class="rphase" id="rphase">${a.phase==='ready'?'Pause finie':a.phase==='done'?'Objectif atteint':''}</p>` : '';
    return wrap(`${ph}<div class="rtimer" id="rtimer">${idle?'—':'00:00'}</div>${prog}
      <p class="rsum">${otherDevice(a) ? 'Session en cours sur un autre appareil.<br>Termine-la là-bas : ça se mettra à jour ici tout seul.'
        : "Session en cours dans une autre fenêtre.<br>Tu l'as fermée ? Recharge cette page pour la reprendre ici."}</p>`);
  }
  if(a.mode==='pomo'){
    if(a.phase==='done') return wrap(`<span class="brdone">${ic('bell',36)}</span>
      <p class="brready">Objectif atteint</p>
      <p class="rsum">${fmtDur(a.workDone)} de travail en ${a.blocks} bloc${a.blocks>1?'s':''}</p>${plan}${stop}${more}`);
    if(a.phase==='ready') return wrap(`<p class="rphase brk">Pause finie</p>
      <p class="rsum">Durée du prochain bloc :</p>
      <div class="optchips">${POMO_OPTS.map(b=>`<button class="optchip${a.block===b?' on':''}" onclick="setNextBlock(${b})">${b} min</button>`).join('')}</div>
      ${prog}${plan}
      <button class="bigbtn bigwork" onclick="pomoGo()">${ic('play',20)}<span>C'est reparti</span></button>
      <button class="bigbtn bigsec" onclick="stopSession()">${ic('stop',18)}<span>Terminer</span></button>`);
    return wrap(`<p class="rphase${a.phase==='break'?' brk':''}" id="rphase"></p>
      <div class="rtimer" id="rtimer">00:00</div>${prog}${plan}${stop}`);
  }
  const reached = a.reached ? `<p class="rreached">${ic('bell',18)}<span>Objectif atteint</span></p>` : '';
  return wrap(`<div class="rtimer" id="rtimer">00:00</div>${reached}${prog}
    <div class="rwarn" id="rwarn" style="display:none">${ic('clock',14)}<span>En session depuis plus de ${MAX_SESSION_H} h — pense à terminer.</span></div>
    ${plan}${stop}${a.reached?more:''}`);
}
// Affiche/masque le mode focus selon qu'une session est active. Idempotent (ne reconstruit qu'aux transitions).
let focusShown=false;
function renderFocus(){
  const f=document.getElementById('focus');
  if(data.active && !focusShown){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();   // rien ne reste « en saisie » sous le plein écran
    closePlan();   // une session lancée ailleurs (autre onglet) ne doit pas rester cachée sous la page « liste »
    f.innerHTML=focusCard(); f.classList.remove('hidden'); focusShown=true;
    f.onpointerdown=primeSessBell;   // débloque l'audio au 1er toucher si la session a été reprise sans clic (rechargement)
    if(tick) clearInterval(tick); updateTimer(); tick=setInterval(updateTimer,1000);
  } else if(!data.active && focusShown){
    f.classList.add('hidden'); f.innerHTML=''; focusShown=false; ownSession=false;
    if(tick){ clearInterval(tick); tick=null; }
    closeSessBell();
  }
}
// Changement de phase (fin de bloc, pause, objectif…) : reconstruit le contenu du plein écran.
function refreshFocus(){
  const f=document.getElementById('focus');
  if(!focusShown || !data.active || !f) return;
  f.innerHTML=focusCard(); paintTimer();
}
function graphCard(){
  const tot=matTotals();
  const sum=Object.values(tot).reduce((a,b)=>a+b,0);
  const segl={jour:'Jour',semaine:'Semaine'};
  const seg=['jour','semaine'].map(p=>`<button class="segb${period===p?' on':''}" onclick="setPeriod('${p}')">${segl[p]}</button>`).join('');
  // Navigation : reculer/avancer d'une fenêtre (jamais dans le futur).
  const nav=`<div class="navper">
    <button class="pnav" onclick="shiftPeriod(-1)" title="Précédent" aria-label="Période précédente">${ic('chevleft',18)}</button>
    <span class="plabelw">${windowLabel()}</span>
    <button class="pnav" onclick="shiftPeriod(1)" ${periodOffset>=0?'disabled':''} title="Suivant" aria-label="Période suivante">${ic('chevron',18)}</button>
  </div>`;
  // Moyenne quotidienne (vue semaine) : vraie donnée = total / jours pris en compte.
  let avgMs=0, sub='';
  if(period==='semaine' && sum>0){
    const {start}=periodWindow(); let div=7;
    if(periodOffset===0){ const t=new Date(); t.setHours(0,0,0,0); div=Math.round((t-start)/86400000)+1; }
    avgMs=sum/Math.max(1,div);
    sub=`Moyenne ${fmtDur(avgMs)} / jour`;
  }
  const barsHtml = barChartSVG(avgMs/60000);   // SVG : barres empilées + grille + axe + ligne de moyenne
  // Légende = gestion des couleurs : toutes les matières, pastille éditable + total sur la période.
  const legend=`<div class="legend">`+data.matieres.map(m=>`<div class="legrow">
      <button class="legdot" style="--c:${m.color}" title="Changer la couleur" aria-label="Changer la couleur de ${escapeH(m.nom)}" onclick="openColorPick('${m.id}',this)"></button>
      <span class="legname">${escapeH(m.nom)}</span>
      <span class="legtime">${fmtDur(tot[m.id]||0)}</span></div>`).join('')+`</div>`;
  return `<div class="card">
    <div class="seg">${seg}</div>
    ${nav}
    <div class="sttotal">${fmtDur(sum)}</div>
    ${sub?`<div class="stsub">${sub}</div>`:''}
    ${barsHtml}
    ${daySessionsHTML()}
    ${dayDebriefsHTML()}
    ${legend}
  </div>`;
}
// Vue Jour uniquement : liste des sessions individuelles de la journée affichée, avec suppression —
// permet de corriger une session erronée (ex : page oubliée ouverte) sans passer par la console.
function daySessionsHTML(){
  if(period!=='jour') return '';
  const list=sessionsInPeriod().slice().sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
  if(!list.length) return '';
  const rows=list.map(s=>{
    const idx=data.sessions.indexOf(s), mat=matById(s.mat);
    const t1=new Date(s.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const t2=new Date(s.end).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<div class="sessrow">
      <span class="sessdot" style="background:${mat?mat.color:'var(--muted)'}"></span>
      <span class="sessname">${escapeH(mat?mat.nom:'—')}</span>
      <span class="sesstime">${t1}–${t2} · ${fmtDur(Date.parse(s.end)-Date.parse(s.start))}</span>
      <button class="iconbtn" aria-label="Supprimer cette session" title="Supprimer" onclick="delSession(${idx})">${ic('trash',16)}</button>
    </div>`;
  }).join('');
  return `<div class="sesslist">${rows}</div>`;
}

function moodOf(k){ const m=MOODS.find(x=>x[0]===k); return m?{e:m[1],l:m[2]}:{e:'',l:''}; }

function fmtDayShort(ms){ const d=new Date(ms), k=dateKey(ms);
  if(k===todayKey()) return "Aujourd'hui"; if(k===dateKey(Date.now()-86400000)) return 'Hier';
  return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); }
function dayDebriefsHTML(){
  if(period!=='jour') return '';
  const {start,end}=periodWindow();
  const list=(data.debriefs||[]).filter(d=>{ const t=Date.parse(d.start); return t>=start && t<end; })
    .sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
  if(!list.length) return '';
  return `<div class="dblist"><p class="dbtitle">Bilans</p>${list.map(d=>debriefCardHTML(d,false)).join('')}</div>`;

// Historique complet (page Stats), du plus récent au plus ancien, par paquets de 10.
let dbHistLimit=10;
function debriefHistoryHTML(){
  const all=(data.debriefs||[]).slice().sort((a,b)=>Date.parse(b.start)-Date.parse(a.start));
  if(!all.length) return '';
  const tally={ok:0,mid:0,ko:0}; all.forEach(d=>{ if(d.mood in tally) tally[d.mood]++; });
  const shown=all.slice(0,dbHistLimit);
  return `<div class="card dbhist">
    <div class="dbhisthead"><h3>Historique des bilans</h3>
      <span class="dbtally">✅ ${tally.ok} · ${WAVE_ICON} ${tally.mid} · ❌ ${tally.ko}</span></div>
    ${shown.map(d=>debriefCardHTML(d,true)).join('')}
    ${all.length>shown.length?`<button class="bigbtn bigsec dbmore" onclick="dbHistLimit+=10;renderStats()">Voir plus (${all.length-shown.length})</button>`:''}
  </div>`;
}
function goStatsToday(){ period='jour'; periodOffset=0; goPage('stats'); }
async function delSession(idx){
  const s=data.sessions[idx]; if(!s) return;
  const mat=matById(s.mat), dur=fmtDur(Date.parse(s.end)-Date.parse(s.start));
  const ok=await uiConfirm(`Supprimer cette session${mat?' en '+mat.nom:''} (${dur}) ? Elle ne sera plus comptée dans ton temps de travail.`,
    {title:'Supprimer la session', ok:'Supprimer', danger:true});
  if(!ok) return;
  data.sessions.splice(idx,1); save(); renderTempsStats();
}
// Changer Jour⇄Semaine garde la position dans le temps (façon « temps d'écran ») :
// revenir de Jour → Semaine ramène sur LA semaine du jour affiché, pas la semaine courante.
function setPeriod(p){
  if(p===period){ renderTempsStats(); return; }
  const today=new Date(); today.setHours(0,0,0,0);
  const monOf=ms=>{ const d=new Date(ms); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); };
  const {start}=periodWindow();            // début de la fenêtre actuelle (jour ou lundi)
  if(p==='semaine'){
    periodOffset=Math.round((monOf(start)-monOf(today.getTime()))/(7*86400000));
  }else{
    const target=Math.min(addDays(start,6), today.getTime());  // aujourd'hui si semaine courante, sinon dimanche
    periodOffset=Math.round((target-today.getTime())/86400000);
  }
  period=p; renderTempsStats();
}
function shiftPeriod(d){ if(periodOffset+d>0) return; periodOffset+=d; renderTempsStats(); }
// Vue semaine : cliquer un jour ouvre son détail heure-par-heure (façon « temps d'écran »). Jamais le futur.
function drillDay(i){
  const {start}=periodWindow();                 // lundi de la semaine affichée
  const today=new Date(); today.setHours(0,0,0,0);
  const off=Math.round((addDays(start,i)-today.getTime())/86400000);
  if(off>0) return;
  period='jour'; periodOffset=off; renderTempsStats();
}

// ---- Sélecteur de couleur maison (offline, ancré au clic) ----
// Panneau interne = carré saturation/valeur + curseur de teinte + hex. Aucun panneau OS
// (le natif ne s'ouvre pas de façon fiable dans Safari et se plaçait dans un coin).
let cpH=0, cpS=0, cpV=0, cpOnPick=null, cpOnLive=null;   // teinte 0-360, sat/val 0-1
function hexToHsv(hex){ if(!/^#?[0-9a-f]{6}$/i.test(hex||'')) return null; hex=hex.replace('#','');
  const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return {h, s: mx? d/mx : 0, v: mx}; }
function hsvToHex(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r,g,b;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const to=n=>Math.round((n+m)*255).toString(16).padStart(2,'0'); return '#'+to(r)+to(g)+to(b); }
// Ouvre le sélecteur près de `anchor`, initialisé sur `currentHex` ; `onPick(hex)` à la fermeture,
// `onLive(hex)` (optionnel) à chaque mouvement — pour un aperçu en direct sans coût de save()/render().
function openPicker(anchor, currentHex, onPick, onLive){
  cpOnPick=onPick; cpOnLive=null;   // onLive branché après le positionnement (voir plus bas) : sinon un aperçu en direct
                                    // qui reconstruit l'ancre (cas "nouvelle matière") la détache avant qu'on lise sa position.
  const hsv=hexToHsv(currentHex)||{h:210,s:.55,v:.9}; cpH=hsv.h; cpS=hsv.s; cpV=hsv.v;
  document.getElementById('cpHue').value=Math.round(cpH);
  document.getElementById('cpick').classList.remove('hidden');
  cpickRender();
  const panel=document.getElementById('cpickPanel');
  const r=(anchor&&anchor.getBoundingClientRect)?anchor.getBoundingClientRect():null;
  let left = r? r.left : (innerWidth-panel.offsetWidth)/2;
  let top  = r? r.bottom+6 : innerHeight*0.25;
  left=Math.max(8, Math.min(left, innerWidth  - panel.offsetWidth  - 8));
  top =Math.max(8, Math.min(top,  innerHeight - panel.offsetHeight - 8));
  panel.style.left=left+'px'; panel.style.top=top+'px';
  cpOnLive=onLive||null;   // n'active l'aperçu en direct qu'une fois le panneau positionné
}
function cpickRender(){
  const hex=hsvToHex(cpH,cpS,cpV);
  document.getElementById('cpSV').style.background=
    `linear-gradient(to bottom, transparent, #000), linear-gradient(to right, #fff, hsl(${cpH},100%,50%))`;
  const th=document.getElementById('cpThumb'); th.style.left=(cpS*100)+'%'; th.style.top=((1-cpV)*100)+'%';
  th.style.background=hex;
  document.getElementById('cpPrev').style.background=hex;
  const hx=document.getElementById('cpHex'); if(document.activeElement!==hx) hx.value=hex.toUpperCase();
  if(cpOnLive) cpOnLive(hex);
}
function closeCPick(){ const ov=document.getElementById('cpick'); if(!ov||ov.classList.contains('hidden')) return;
  ov.classList.add('hidden'); const cb=cpOnPick; cpOnPick=null; if(cb) cb(hsvToHex(cpH,cpS,cpV)); }
// Compat : les appelants existants (.dotbtn, .legdot) passent une matière → applique + re-render.
function openColorPick(id, anchor){ const m=matById(id); if(!m) return;
  openPicker(anchor, m.color,
    hex=>{ const mm=matById(id); if(mm){ mm.color=hex; save(); render(); } },
    hex=>{ const dot=anchor.querySelector('.mdot'); if(dot) dot.style.background=hex; else anchor.style.background=hex; }); }

// ---- Modale maison : remplace prompt()/confirm() natifs (rendu cohérent avec l'app) ----
let modalResolve=null;
function closeModal(val){
  const gr=debrief&&debrief._ar; debrief=null;   // Échap / clic dehors sur le bilan = Passer (la jauge s'affiche quand même)
  if(gr) setTimeout(()=>openGauge(gr),0);
  const m=document.getElementById('modal');
  m.classList.add('hidden'); m.innerHTML='';
  const r=modalResolve; modalResolve=null; if(r) r(val);
  if(typeof queueStepReveal==='function') queueStepReveal();
}
// Confirmation → Promise<boolean>. danger = bouton rouge.
function uiConfirm(message,{title='Confirmer',ok='Confirmer',danger=false}={}){
  return new Promise(res=>{ modalResolve=res;
    const m=document.getElementById('modal');
    m.innerHTML=`<div class="panel" role="dialog" aria-modal="true">
      <div class="phead"><span>${escapeH(title)}</span>
        <button class="iconbtn" aria-label="Fermer" onclick="closeModal(false)">${ic('x')}</button></div>
      <p class="mdmsg">${escapeH(message)}</p>
      <div class="mdactions">
        <button class="mdbtn" onclick="closeModal(false)">Annuler</button>
        <button class="mdbtn ${danger?'danger':'primary'}" onclick="closeModal(true)">${escapeH(ok)}</button>
      </div></div>`;
    m.classList.remove('hidden');
    const b=m.querySelector('.mdbtn:last-child'); if(b) b.focus();
  });
}
// Saisie texte → Promise<string|null> (null = annulé).
function uiPrompt(def='',{title='Renommer',ok='Valider',message=''}={}){
  return new Promise(res=>{ modalResolve=res;
    const m=document.getElementById('modal');
    m.innerHTML=`<div class="panel" role="dialog" aria-modal="true">
      <div class="phead"><span>${escapeH(title)}</span>
        <button class="iconbtn" aria-label="Fermer" onclick="closeModal(null)">${ic('x')}</button></div>
      ${message?`<p class="mdmsg">${escapeH(message)}</p>`:''}
      <input id="mdInput" class="mdinput" type="text" value="${escapeH(def)}" maxlength="120"
        onkeydown="if(event.key==='Enter')submitPrompt();else if(event.key==='Escape')closeModal(null)">
      <div class="mdactions">
        <button class="mdbtn" onclick="closeModal(null)">Annuler</button>
        <button class="mdbtn primary" onclick="submitPrompt()">${escapeH(ok)}</button>
      </div></div>`;
    m.classList.remove('hidden');
    const i=document.getElementById('mdInput'); if(i){ i.focus(); i.select(); }
  });
}
function submitPrompt(){ const i=document.getElementById('mdInput'); closeModal(i?i.value:null); }

// Modale « Nouvelle matière » : nom + choix de la couleur → Promise<{nom,color}|null>.
let newMatColor=null;
// Une seule pastille = la couleur choisie ; taper ouvre le sélecteur maison (pas de presets).
function nmColorHTML(){ const v=newMatColor||'#888888';
  return `<button type="button" class="nmcolor" title="Choisir la couleur" aria-label="Choisir la couleur" style="background:${v}"
    onclick="openPicker(this, newMatColor||'#888888', pickNewMatColor, pickNewMatColor)"></button>`; }
function pickNewMatColor(c){ newMatColor=c; const box=document.getElementById('nmSwatches'); if(box) box.innerHTML=nmColorHTML(); }
function promptNewMatiere(){
  return new Promise(res=>{ modalResolve=res;
    const m=document.getElementById('modal');
    m.innerHTML=`<div class="panel" role="dialog" aria-modal="true">
      <div class="phead"><span>Nouvelle matière</span>
        <button class="iconbtn" aria-label="Fermer" onclick="closeModal(null)">${ic('x')}</button></div>
      <input id="mdInput" class="mdinput" type="text" value="" maxlength="120" placeholder="Nom de la matière"
        onkeydown="if(event.key==='Enter')submitNewMat();else if(event.key==='Escape')closeModal(null)">
      <p class="mdmsg" style="margin:14px 0 8px;font-weight:600">Couleur</p>
      <div id="nmSwatches">${nmColorHTML()}</div>
      <div class="mdactions">
        <button class="mdbtn" onclick="closeModal(null)">Annuler</button>
        <button class="mdbtn primary" onclick="submitNewMat()">Ajouter</button>
      </div></div>`;
    m.classList.remove('hidden');
    const i=document.getElementById('mdInput'); if(i) i.focus();
  });
}
function submitNewMat(){ const i=document.getElementById('mdInput'); closeModal(i?{nom:i.value,color:newMatColor}:null); }

// ---- Icônes statiques + démarrage ----
// Icônes de la barre de navigation flottante.
const TAB_ICONS = {accueil:'home', matieres:'book', session:'clock', stats:'bars', reglages:'settings'};
document.querySelectorAll('#tabbar .tab').forEach(b=>{
  const span=b.querySelector('.tabic'); if(span) span.innerHTML=ic(TAB_ICONS[b.dataset.p]||'home',22);
});
{ const sbl=document.getElementById('sbLogo'); if(sbl) sbl.innerHTML=ic('book',18); }
{ const tci=document.getElementById('tbCtaIc'); if(tci) tci.innerHTML=ic('plus',18); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){
  const cp=document.getElementById('cpick'); if(cp && !cp.classList.contains('hidden')){ closeCPick(); return; }
  const md=document.getElementById('modal'); if(md && !md.classList.contains('hidden')){ closeModal(null); return; }
  if(roadOpen()){ closeRoad(); return; }
  const ps=document.getElementById('planScreen'); if(ps && !ps.classList.contains('hidden')){ closePlan(); return; }
  const br=document.getElementById('breathe'); if(br && !br.classList.contains('hidden')){ cancelBreatheDone(); return; }
  if(agOpen && page==='session'){ closeAgNew(); return; } } });
// Synchro entre onglets/fenêtres de la même origine (même localStorage) : sans ceci, un onglet
// resté ouvert avec une copie périmée de `data` en mémoire écrase silencieusement le localStorage
// avec ses vieilles données au premier save() qu'il déclenche — perte de données réelle, sans
// jamais passer par le cloud ni afficher le moindre message (incident du 06/09, 3 fenêtres ouvertes
// avec le même compte : un onglet périmé a écrasé les données fraîches d'un autre onglet).
window.addEventListener('storage', e=>{
  if(e.key!==STORE_KEY || e.newValue==null || (data.active && ownSession)) return;   // session pilotée par CET onglet : ne rien toucher
  try{ data = backfillDaily(prepare(JSON.parse(e.newValue))); markSynced(); current=null; render(); refreshFocus(); }catch(err){}   // l'autre onglet s'occupe de l'envoi
});
// Interactions du sélecteur de couleur maison (carré S/V + teinte + hex), câblées une fois.
(function(){ const sv=document.getElementById('cpSV'); if(!sv) return; let drag=false;
  const pick=e=>{ const r=sv.getBoundingClientRect();
    cpS=Math.min(Math.max((e.clientX-r.left)/r.width,0),1);
    cpV=1-Math.min(Math.max((e.clientY-r.top)/r.height,0),1); cpickRender(); };
  sv.addEventListener('pointerdown', e=>{ drag=true; sv.setPointerCapture(e.pointerId); pick(e); });
  sv.addEventListener('pointermove', e=>{ if(drag) pick(e); });
  sv.addEventListener('pointerup', ()=>{ drag=false; });
  document.getElementById('cpHue').addEventListener('input', e=>{ cpH=+e.target.value; cpickRender(); });
  document.getElementById('cpHex').addEventListener('change', e=>{ const v=hexToHsv(e.target.value.trim());
    if(v){ cpH=v.h; cpS=v.s; cpV=v.v; document.getElementById('cpHue').value=Math.round(cpH); } cpickRender(); });
})();

let savedTheme = localStorage.getItem(THEME_KEY);
if(!THEMES[savedTheme]) savedTheme='slate';   // migration des anciens thèmes (bleu/bleuvert…, ou l'ancien « auto ») → clair
applyTheme(savedTheme);
recoverStaleSession();
ownSession = !!data.active && !otherDevice(data.active);   // session reprise au chargement : cet onglet la pilote (sauf si lancée sur un autre appareil)
// Retour du lien "mot de passe oublié" : Supabase redirige ici avec #access_token=…&type=recovery.
const recoveryFromLink = parseRecoveryHash();
if(recoveryFromLink){ recoverySession = recoveryFromLink; history.replaceState(null, '', location.pathname + location.search); }
// Compte : une session valide boot direct (hors-ligne garanti, la réconciliation cloud tourne en
// tâche de fond) ; sans session → écran de connexion (sauf app pas encore configurée pour les comptes).
if(recoverySession){ showAuthGate('reset'); }
else if(!authSession && supaConfigured()){ showAuthGate('login'); }
else if(authSession){ scheduleRefresh(); reconcileOnLogin(); }
// Garde-fou : si l'affichage plante sur un état inattendu, on montre un écran de secours
// (tes données restent intactes) plutôt qu'une page blanche irrécupérable.
try{ render(); }
catch(e){
  console.error(e);
  document.querySelector('.wrap').innerHTML =
    `<div class="empty">
      <h2>Oups, souci d'affichage</h2>
      <p>Tes données sont toujours là. Sauvegarde-les d'abord, puis recharge proprement si besoin.</p>
      <button class="cta" onclick="exportData()">${ic('download',20)}<span>Sauvegarder mes données</span></button>
      <button class="dbtn danger" style="margin:14px auto 0;max-width:300px"
        onclick="if(confirm('Effacer les données et recharger ?')){localStorage.removeItem(STORE_KEY);location.reload();}">
        ${ic('reset',18)}<span>Réinitialiser l'affichage</span></button>
    </div>`;
}
// Notif "chapitres à réévaluer" (bonus desktop, no-op ailleurs) : seulement si l'écran de connexion
// n'est pas affiché, pour ne pas interrompre une saisie avec une demande de permission navigateur.
{ const ag=document.getElementById('authgate'); if(!ag || ag.classList.contains('hidden')){ maybeNotifyReeval(); maybeShowReevalPopup(); } }

// --- Mise à jour automatique ---
// À l'ouverture, si EN LIGNE, on vérifie discrètement une version plus récente et on la
// charge (en contournant le cache). Hors-ligne / file:// → no-op : l'app reste utilisable.
(function checkUpdate(){
  try{
    if(location.protocol==='file:') return;
    fetch('index.html?_='+Date.now(), {cache:'no-store'})
      .then(r=>r.ok?r.text():null)
      .then(t=>{
        if(!t) return;
        const m=t.match(/const VERSION = '([^']+)'/);
        if(m && m[1] && m[1]!==VERSION && sessionStorage.getItem('vseen')!==m[1]){
          const ag=document.getElementById('authgate'); if(ag && !ag.classList.contains('hidden')) return;   // pas d'interruption pendant une saisie
          if(data.active) return;   // pas d'interruption pendant une session de travail en cours — on retentera au prochain chargement
          sessionStorage.setItem('vseen', m[1]);   // garde-fou anti-boucle
          location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
        }
      }).catch(()=>{});
  }catch(e){}
})();
// Curseur de maîtrise au doigt : un toucher loin du rond (à côté, ou juste sous la barre) ne fait plus sauter la valeur.
// Il faut poser le doigt sur le rond (ou tout près) pour le faire glisser — testé : un toucher 10 px sous la barre passait un chapitre de 0 à 90 %.
document.addEventListener('touchstart',e=>{
  const r=e.target; if(!(r instanceof HTMLInputElement) || r.type!=='range' || !r.closest('.chap')) return;
  const t=e.touches[0], b=r.getBoundingClientRect(), th=22, k=(r.value-r.min)/((r.max-r.min)||1);
  const x=b.left+th/2+k*(b.width-th), y=b.top+b.height/2;
  if(Math.abs(t.clientX-x)>30 || Math.abs(t.clientY-y)>16) e.preventDefault();
},{passive:false});
</script>
