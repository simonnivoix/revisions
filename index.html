<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Mes révisions</title>
<!-- iPad : permet « Sur l'écran d'accueil » → app plein écran -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Révisions">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EAF0F6">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230369A1'/%3E%3Ctext x='90' y='128' font-size='104' text-anchor='middle'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
  /* Palette neutre « slate » : fond neutre clair, un seul accent bleu.
     Règle 60-30-10 — les couleurs rouge/orange/jaune/vert ne servent QUE l'indicateur
     de maîtrise (barres, %, courbe), jamais la décoration ou la navigation. */
  :root{
    --bg:#EAF0F6;          /* 60% fond (bleu-gris frais, fait ressortir les cartes) */
    --bg2:#D8E2EC;         /* pistes de barres / sliders */
    --card:#FFFFFF;        /* 30% surfaces */
    --ink:#0F172A;         /* texte principal */
    --muted:#4F5E6C;       /* texte secondaire / labels (assombri pour le contraste AA) */
    --line:#D8E2EC;        /* bordures fines */
    --primary:#0369A1;     /* 10% accent : liens, focus, CTA */
    --rouge:#DC2626; --orange:#F97316; --jaune:#CA8A04; --vert:#16A34A;
    --shadow:0 1px 3px rgba(15,23,42,.08);
    --ring:rgba(3,105,161,.16);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;
       transition:background-color .3s ease,color .3s ease}
  .wrap{max-width:920px;margin:0 auto;padding:30px 22px 60px}
  .ic{display:inline-block;vertical-align:middle;flex-shrink:0}

  /* ---------- En-tête ---------- */
  header{margin-bottom:22px}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .tagline{color:var(--muted);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px}
  .gpill{font-weight:700}
  .iconbtn{background:none;border:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;
           justify-content:center;min-width:44px;min-height:44px;border-radius:10px;padding:0;transition:.15s}
  .iconbtn:hover{color:var(--primary);background:var(--bg2)}
  .iconbtn:active{transform:scale(.94)}

  /* ---------- Vue accueil : grille de matières ---------- */
  .grid{display:flex;flex-wrap:wrap;gap:14px;align-items:start}
  .grid .mcard{flex:0 1 230px}   /* largeur ~230, s'allonge selon le plus long mot (pas de coupe), sans se gonfler pour remplir la ligne */
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;color:var(--ink);
         box-shadow:var(--shadow);position:relative;text-align:left;
         display:grid;grid-template-columns:1fr auto auto;align-items:center;column-gap:12px;row-gap:12px;
         transition:transform .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s ease,background-color .3s ease,border-color .3s ease,color .3s ease;
         animation:rise .4s cubic-bezier(.22,.61,.36,1) backwards}
  .mcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,23,42,.10)}
  .mcard:active{transform:translateY(-1px) scale(.992)}
  .mcard.done{border-color:var(--vert)}
  .mcard.done .go{color:var(--vert)}
  .mcard .top{min-width:min-content}
  .mcard .name{font-size:16px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:9px}
  .mcard .name .nm{overflow-wrap:normal;word-break:normal}
  .mcard .mdot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .mcard .meta{font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
  .mcard .pct{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;text-align:right;white-space:nowrap}
  .mcard .pct .u{font-size:15px;font-weight:500;color:var(--muted);margin-left:1px}
  .mcard .pbar{grid-column:1/-1;height:7px;border-radius:5px;background:var(--bg2);overflow:hidden}
  .mcard .pbar>span{display:block;height:100%;border-radius:5px;transition:width .55s cubic-bezier(.22,.61,.36,1),background .3s}
  .mcard .go{color:var(--muted);display:inline-flex;align-self:center;opacity:.55}
  .addcard{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);
           background:transparent;box-shadow:none;color:var(--muted);font-size:14px;font-weight:600;min-height:90px}
  .addcard:hover{border-color:var(--primary);color:var(--primary);transform:none;box-shadow:none}

  /* ---------- État vide ---------- */
  .empty{max-width:380px;margin:46px auto;text-align:center;color:var(--ink);animation:rise .4s ease backwards}
  .bookic{color:var(--muted);display:inline-flex}
  .empty h2{font-size:18px;font-weight:600;margin:10px 0 8px}
  .empty p{font-size:14px;line-height:1.5;color:var(--muted);margin:0 0 22px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border:none;
       font-size:16px;font-weight:600;padding:12px 22px;border-radius:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .cta:hover{filter:brightness(1.07)}
  .cta:active{transform:scale(.97)}

  /* ---------- Vue détail matière ---------- */
  .back{background:none;border:none;color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;
        padding:6px 0;margin-bottom:14px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .back:hover{opacity:.78}
  .back:active{transform:scale(.97)}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .dhead h2{margin:0;font-size:22px;font-weight:600;flex:1;line-height:1.2;display:flex;align-items:center;gap:10px}
  .dhead .mdot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
  .dhead .dotbtn{background:none;border:none;padding:16px;margin:-16px;cursor:pointer;display:inline-flex;align-items:center;border-radius:50%;flex-shrink:0}
  .dhead .dotbtn:active{transform:scale(.9)}
  .badge{font-weight:700;font-size:15px;color:#fff;padding:4px 12px;border-radius:999px}
  .dsub{color:var(--muted);font-size:12px;margin:0 0 18px}

  .chap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;
        box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.22,.61,.36,1) backwards;
        transition:transform .18s cubic-bezier(.22,.61,.36,1),box-shadow .2s ease,background-color .3s ease,border-color .3s ease,color .3s ease}
  .chap:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.08)}
  .chap.done{border-color:var(--vert)}
  @keyframes chapFlash{0%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:var(--shadow)}}
  .chap.justopened{animation:chapFlash 1.6s ease}
  .chap .top{display:flex;align-items:center;gap:8px}
  .chap .cname{font-size:15px;font-weight:500;flex:1;min-width:0;line-height:1.3;overflow-wrap:normal;word-break:normal}
  .chap .cdone{color:var(--vert);display:inline-flex}
  .chap .cpct{font-size:15px;font-weight:700;min-width:42px;flex-shrink:0;text-align:right}
  .chap .bar{height:8px;border-radius:5px;background:var(--bg2);overflow:hidden;margin:10px 0 0}
  .chap .bar>span{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.22,.61,.36,1),background .3s}
  .chap .ctrl{display:flex;align-items:center;gap:10px;margin-top:11px}

  /* Curseur gris neutre, rendu identique sur tous les navigateurs (pas de remplissage coloré). */
  .chap input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:120px;
        height:32px;background:transparent;cursor:pointer;margin:0}
  .chap input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:5px;background:var(--bg2)}
  .chap input[type=range]::-moz-range-track{height:6px;border-radius:5px;background:var(--bg2)}
  .chap input[type=range]::-moz-range-progress{height:6px;border-radius:5px;background:var(--bg2)}
  .chap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
        border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.22);margin-top:-8px;
        transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
  .chap input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
        background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.22);
        transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
  .chap input[type=range]:active::-webkit-slider-thumb,.chap input[type=range]:focus-visible::-webkit-slider-thumb{
        transform:scale(1.2);border-color:var(--primary);box-shadow:0 0 0 7px var(--ring),0 1px 4px rgba(0,0,0,.28)}
  .chap input[type=range]:active::-moz-range-thumb,.chap input[type=range]:focus-visible::-moz-range-thumb{
        transform:scale(1.2);border-color:var(--primary);box-shadow:0 0 0 7px var(--ring),0 1px 4px rgba(0,0,0,.28)}

  .seegraph{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--muted);
            border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
            white-space:nowrap;transition:.15s;min-height:40px}
  .seegraph:hover{border-color:var(--primary);color:var(--primary)}
  .seegraph.on{border-color:var(--primary);color:var(--primary)}
  .seegraph:active{transform:scale(.96)}
  .delc{background:none;border:none;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;
        justify-content:center;min-width:44px;min-height:44px;border-radius:10px;padding:0;transition:.15s}
  .delc:hover{color:var(--rouge)}
  .delc:active{transform:scale(.94)}
  .chap .delc{opacity:.7;min-width:44px;min-height:44px;margin-left:6px}
  .chap .delc:hover{opacity:1}
  .dtrash{color:var(--muted)}

  /* ---------- Graphe d'évolution de la maîtrise ---------- */
  .chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
            margin-bottom:18px;box-shadow:var(--shadow)}
  .chartbox h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .chartsvg{width:100%;height:auto;display:block;font-family:inherit}
  .chartsvg .cg{stroke:var(--line);stroke-width:1}
  .chartsvg .cyl{fill:var(--muted);font-size:12px;text-anchor:end}
  .chartsvg .cxl{fill:var(--muted);font-size:12px;text-anchor:middle}
  .chartempty{color:var(--muted);font-size:13px;margin:6px 0 2px}
  .minichart{display:none;margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
  .minichart.open{display:block}
  .minichart .chartsvg{width:100%;height:auto;display:block}
  .chartsvg circle{cursor:pointer}
  .cname,.dhead h2{cursor:text}

  .add-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px dashed var(--line);
           border-radius:12px;padding:0 6px 0 14px;margin-bottom:14px;color:var(--muted);transition:.15s}
  .add-row:focus-within{border-color:var(--primary);color:var(--primary)}
  .addchap{flex:1;background:none;border:none;padding:15px 0;font-size:16px;color:var(--ink);font-family:inherit}
  .addchap::placeholder{color:var(--muted)}
  .addchap:focus{outline:none}

  /* ---------- Menu réglages (overlay) ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;
           padding:56px 16px;z-index:65;animation:fade .2s ease}
  /* z-index 65 (pas 50) : #modal doit passer au-dessus du plein écran session (.focusov, 55) et méditation
     (.brov, 60) — depuis que la confirmation de session trop longue peut s'ouvrir depuis le mode focus. */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:360px;
         max-height:calc(100vh - 112px);overflow:auto;
         box-shadow:0 14px 44px rgba(15,23,42,.28);animation:rise .25s cubic-bezier(.22,.61,.36,1)}
  .panel.wide{max-width:640px}
  .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .phead>span{font-size:16px;font-weight:600}
  .plabel{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
  .topt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid transparent;border-radius:10px;
        padding:9px 10px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);min-height:44px;transition:.12s;margin-bottom:2px}
  .topt:hover{background:var(--bg2)}
  .topt.on{border-color:var(--primary)}
  .tdot{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex-shrink:0}
  .tlabel{flex:1;text-align:left}
  .tcheck{color:var(--primary);display:none}
  .topt.on .tcheck{display:inline-flex}
  .dbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:1px solid var(--line);border-radius:10px;
        padding:0 14px;min-height:46px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
        margin-bottom:8px;transition:.12s}
  .dbtn:hover{border-color:var(--primary);color:var(--primary)}
  .dbtn:active{transform:scale(.98)}
  .dbtn.danger{color:var(--rouge)}
  .dbtn.danger:hover{border-color:var(--rouge);color:var(--rouge)}
  .pfoot{font-size:12px;color:var(--muted);margin:14px 0 0;text-align:center}

  /* ---------- Écran de connexion (plein écran brandé, pas une modale) ---------- */
  .authov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;align-items:center;justify-content:center;
          padding:24px;animation:fade .25s ease}
  .authcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;
            padding:36px 28px 28px;box-shadow:0 20px 60px rgba(15,23,42,.14);animation:rise .3s cubic-bezier(.22,.61,.36,1)}
  .authbrand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px;text-align:center}
  .authbrand .logo{width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;
                    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(3,105,161,.25);flex-shrink:0}
  .authbrand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .authbrand p{font-size:13.5px;color:var(--muted);margin:0;line-height:1.4}
  .authinput{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;
             padding:14px 16px;font-family:inherit;font-size:16px;outline:none;margin-bottom:12px;transition:.15s}
  .authinput:focus{border-color:var(--primary);background:var(--card)}
  .authcta{width:100%;background:var(--primary);color:#fff;border:none;font-size:15.5px;font-weight:700;
           padding:14px;border-radius:12px;cursor:pointer;font-family:inherit;transition:.15s;margin-top:4px}
  .authcta:hover{filter:brightness(1.07)}
  .authcta:active{transform:scale(.98)}
  .authcta:disabled{opacity:.6;cursor:default}
  .authswitch{text-align:center;margin-top:22px;font-size:14px;color:var(--muted)}
  .authswitch button{background:none;border:none;color:var(--primary);font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;
                      padding:12px 4px;margin:-12px -4px}
  .autherr{font-size:13.5px;color:var(--rouge);margin:-2px 0 12px;text-align:center;line-height:1.4}
  .authforgot{text-align:right;margin:-8px 0 14px}
  .authforgot button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;
                      padding:12px 2px;margin:-12px -2px}
  .authforgot button:hover{color:var(--primary)}

  /* ---------- Page « Temps de travail » ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;
        box-shadow:var(--shadow);animation:rise .4s cubic-bezier(.22,.61,.36,1) backwards}
  /* Choix de la matière + lancement */
  .sessionwrap{min-height:58vh;display:flex;align-items:center}
  .sessioncard{width:100%}
  .sesshead{text-align:center;margin-bottom:18px;color:var(--ink)}
  .sesshead svg{color:var(--primary)}
  .sesshead h2{margin:6px 0 5px;font-size:20px;font-weight:600}
  .sesshead p{margin:0 auto;max-width:300px;font-size:13px;color:var(--muted);line-height:1.45}
  .sessioncard .matchips{justify-content:center}
  .matchips{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 16px}
  .matchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1.5px solid transparent;
           border-radius:999px;padding:9px 15px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
           cursor:pointer;min-height:42px;transition:.15s}
  .matchip .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex-shrink:0}
  .matchip.on{border-color:var(--c);background:var(--card)}
  .matchip:active{transform:scale(.97)}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:14px;
          font-family:inherit;font-size:17px;font-weight:700;color:#fff;padding:16px;cursor:pointer;min-height:56px;transition:.15s}
  .bigbtn:active{transform:scale(.985)}
  .bigwork{background:var(--primary)}
  .bigwork:disabled,body[data-arena] .bigwork:disabled{opacity:1;cursor:default;background:var(--bg2)!important;color:var(--muted)!important;border:1.5px dashed var(--line)!important;box-shadow:none!important}
  .bigstop{background:var(--ink);color:var(--card)}
  .bigbreathe{background:var(--bg2);color:var(--ink);border:1px solid var(--line);margin-top:10px;font-size:15px;font-weight:600;padding:14px}
  .bigbreathe svg{color:var(--primary)}
  .card.noanim{animation:none}
  /* Objectif + mode (chrono libre / Pomodoro), choisis avant chaque session */
  .sesslbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;margin:2px 0 8px}
  .optchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}
  .optchip{background:var(--bg2);border:1.5px solid transparent;border-radius:999px;padding:8px 15px;font-family:inherit;
           font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;min-height:44px;transition:.15s;font-variant-numeric:tabular-nums}
  .optchip.on{border-color:var(--primary);background:var(--card)}
  .optchip:active{transform:scale(.97)}
  .sessseg{display:flex;justify-content:center}
  .sessseg .seg{margin-bottom:12px}
  .sessseg .segb{min-height:44px;padding-left:16px;padding-right:16px}
  .planwrap{max-width:420px}
  .plantitle{font-size:24px;font-weight:700;margin:14px 0 6px;color:var(--ink)}
  .planwrap .bigsec{margin-top:8px}
  .planadd{margin-bottom:10px}
  .planadd input{font-size:16px;min-height:46px}
  .planlist{display:flex;flex-direction:column;margin:0 0 16px;text-align:left}
  .planrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 2px 4px;border-bottom:1px solid var(--line)}
  .planrow:last-child{border-bottom:none}
  .dbrow{display:flex;align-items:center;gap:11px;min-height:44px;width:100%;background:none;border:none;border-bottom:1px solid var(--line);
         color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;padding:6px 2px}
  .dbrow:last-child{border-bottom:none}
  .dbrow .todochk{flex-shrink:0}
  .focusplan{max-width:320px;margin:0 auto 16px;background:var(--bg2);border-radius:14px;padding:12px 16px 12px 34px;text-align:left;
             font-size:15px;line-height:1.4;color:var(--ink)}
  .focusplan li{padding:3px 0;word-break:break-word}
  /* Jauge après le bilan : colonne d'énergie qui monte vers la carte « ??? » du prochain élément */
  .argauge{position:fixed;inset:0;z-index:94;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 16px;
           background:radial-gradient(60% 45% at 50% 42%,color-mix(in srgb,var(--c) calc(var(--p,0) * 30%),transparent),transparent 72%),#06060B;
           color:#fff;opacity:0;transition:opacity .4s;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:hidden}
  .argauge.show{opacity:1}
  .argauge .wcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .argauge.shake{animation:gShake .5s}
  @keyframes gShake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(2px,-1px)}}
  .gkick{position:relative;font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--c)}
  /* carte mystère du prochain élément, qui s'illumine à mesure que l'énergie monte */
  .gcard{position:relative;width:118px;height:150px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
         background:linear-gradient(160deg,#20202C,#121219);border:2px solid color-mix(in srgb,var(--c) calc(25% + var(--p,0) * 75%),#333);
         box-shadow:0 0 calc(var(--p,0) * 60px) calc(var(--p,0) * 10px) color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 calc(var(--p,0) * 40px) color-mix(in srgb,var(--c) 40%,transparent)}
  .gcard .gq{font-size:56px;font-weight:800;line-height:1;color:color-mix(in srgb,var(--c) calc(var(--p,0) * 100%),#555);text-shadow:0 0 calc(var(--p,0) * 24px) var(--c)}
  .gcard small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
  .gcard.near{animation:gNear .14s linear infinite}
  @keyframes gNear{25%{transform:translate(-1.5px,1px) rotate(-1deg)}75%{transform:translate(1.5px,-1px) rotate(1deg)}}
  .gcard.burst{animation:gBurst .7s cubic-bezier(.3,1.6,.5,1);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#222),#15151c)}
  @keyframes gBurst{0%{transform:scale(1)}30%{transform:scale(1.25)}100%{transform:scale(1)}}
  .gcard.burst .gq{color:#fff}
  .gmain{position:relative;display:grid;grid-template-columns:1fr 120px 1fr;gap:20px;align-items:end;width:min(560px,100%)}
  .gcount{text-align:right;align-self:center}
  .gcount b{display:block;white-space:nowrap;font-size:44px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 24px color-mix(in srgb,var(--c) 60%,transparent)}
  .gcount b.pop{animation:gPop .35s cubic-bezier(.3,1.8,.5,1)}
  @keyframes gPop{40%{transform:scale(1.18)}}
  .gcount small{display:block;margin-top:4px;font-size:13px;opacity:.6}
  .gside{align-self:center;font-size:14px;line-height:1.35;opacity:.8}
  .gside b{display:block;font-size:20px;color:var(--c)}
  /* la colonne */
  .gtube{position:relative;width:120px;height:clamp(200px,40vh,380px);border-radius:16px;overflow:hidden;
         background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.02) 40%,rgba(255,255,255,.07));
         box-shadow:inset 0 0 0 2px rgba(255,255,255,.16),0 0 calc(var(--p,0) * 50px) color-mix(in srgb,var(--c) 55%,transparent)}
  .gtube::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
         background:repeating-linear-gradient(to top,transparent 0 calc(25% - 1px),rgba(255,255,255,.14) calc(25% - 1px) 25%)}
  .gtube::after{content:"";position:absolute;top:0;bottom:0;left:10px;width:14px;z-index:3;border-radius:8px;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.04));pointer-events:none}
  .gfill{position:absolute;left:0;right:0;bottom:0;height:calc(100% * var(--v));
         background:linear-gradient(to top,color-mix(in srgb,var(--c) 45%,#000),var(--c) 60%,color-mix(in srgb,var(--c) 55%,#fff))}
  .gfill .gwave{position:absolute;left:0;width:200%;height:22px;top:-20px;animation:gWave 1.6s linear infinite}
  .gfill .gwave.b{opacity:.5;animation-duration:2.6s;animation-direction:reverse;top:-16px}
  .gfill .gwave path{fill:color-mix(in srgb,var(--c) 55%,#fff)}
  .gfill .gwave.b path{fill:var(--c)}
  @keyframes gWave{to{transform:translateX(-50%)}}
  .gfill .gb{position:absolute;bottom:-10px;border-radius:50%;background:rgba(255,255,255,.55);animation:gBub linear infinite}
  @keyframes gBub{to{transform:translateY(-60vh);opacity:0}}
  .gfill .glite{position:absolute;inset:0;background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.28) 50%,transparent 80%);mix-blend-mode:screen;animation:gLite 2.4s ease-in-out infinite}
  @keyframes gLite{50%{opacity:.4}}
  .gtube.full .gfill{box-shadow:0 0 60px 10px var(--c)}
  .gsegs{position:relative;display:flex;gap:5px;width:min(300px,80vw)}
  .gsegs i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.14);transition:background .4s,box-shadow .4s}
  .gsegs i.got{background:var(--c)}
  .gsegs i.hit{box-shadow:0 0 14px var(--c);background:#fff}
  .gmsg{position:relative;font-size:17px;text-align:center;max-width:360px;line-height:1.4;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
  .gmsg small{display:block;font-size:14px;opacity:.7;margin-top:4px}
  .gmsg.on{opacity:1;transform:none}
  .gbtns{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(8px);transition:opacity .5s .15s,transform .5s .15s;pointer-events:none}
  .gbtns.on{opacity:1;transform:none;pointer-events:auto}
  .gbtn{min-height:52px;padding:0 34px;border:0;border-radius:14px;background:var(--c);color:#0B0B12;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
        box-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent);animation:gGlow 2s ease-in-out infinite}
  @keyframes gGlow{50%{box-shadow:0 0 46px 6px color-mix(in srgb,var(--c) 70%,transparent)}}
  .gsec{min-height:44px;padding:0 16px;border:0;background:none;color:rgba(255,255,255,.7);font-family:inherit;font-size:15px;cursor:pointer}
  @media (max-width:520px){ .gmain{grid-template-columns:1fr 92px 1fr;gap:12px} .gtube{width:92px} .gcount b{font-size:26px} .gside{font-size:13px} .gside b{font-size:17px} .gcard{width:100px;height:126px} .gcard .gq{font-size:46px} }
  @media (max-height:700px){ .gcard{height:104px;width:84px} .gcard .gq{font-size:38px} .gtube{height:clamp(160px,32vh,300px)} }
  .dbplan{margin:0 0 14px}
  .moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
  .moodbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:72px;justify-content:center;background:var(--bg2);
           border:1.5px solid transparent;border-radius:14px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
  .moodbtn.on{border-color:var(--primary);background:var(--card)}
  .mdbtn:disabled,.mdbtn.primary:disabled{opacity:1;cursor:default;background:var(--bg2);color:var(--muted);border-color:var(--line)}
  body[data-arena] :is(.mdbtn.primary,.addbtn):disabled{color:var(--muted)!important;background:var(--bg2)!important;border:1.5px dashed var(--line)!important;box-shadow:none!important}
  .wavebadge{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;border-radius:.24em;
             background:#F28C28;vertical-align:-.18em}
  .wavebadge svg{width:.95em;height:.95em}
  .moodemo{font-size:26px;line-height:1}
  .sesshint{text-align:center;font-size:12.5px;color:var(--muted);margin:-6px 0 16px}
  .bigsec{background:var(--bg2);color:var(--ink);border:1px solid var(--line);margin-top:10px;font-size:15px;font-weight:600;padding:14px}

  /* ---------- Méditation (« Respire ») ---------- */
  .brov{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;animation:fade .25s ease}
  .brwrap{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:28px 20px;max-width:360px;width:100%}
  .brquit{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
          background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .brhint{margin:0;font-size:14px;color:var(--muted);max-width:260px;line-height:1.5}
  .brtime{font-size:56px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin:10px 0}
  .brdurs{display:flex;gap:8px}
  .brdur{background:var(--bg2);border:1.5px solid transparent;border-radius:999px;padding:8px 16px;font-family:inherit;
         font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;min-height:40px;transition:.15s}
  .brdur.on{border-color:var(--primary);background:var(--card)}
  .brchain{margin:0;font-size:13px;color:var(--muted);max-width:280px;line-height:1.45}
  .brstart{max-width:300px;margin-top:2px}
  /* État « chrono terminé » : cloche + phrase, avant la fermeture auto de l'overlay */
  .brdone{width:76px;height:76px;border-radius:50%;background:var(--bg2);color:var(--primary);
          display:flex;align-items:center;justify-content:center;margin:4px 0;animation:brpop .4s ease}
  .brready{margin:0;font-size:18px;font-weight:700;color:var(--ink);max-width:280px;line-height:1.4}
  @keyframes brpop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  /* Session en cours — mode focus plein écran (couvre la barre d'onglets) */
  .focusov{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;display:flex;flex-direction:column;
           align-items:center;justify-content:flex-start;animation:fade .25s ease;
           padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
  .focuswrap{width:100%;max-width:360px;margin:auto 0;text-align:center}
  .focuswrap .bigstop{margin-top:8px}
  /* Session en cours */
  .runcard{text-align:center}
  .runtop{display:inline-flex;align-items:center;gap:9px;margin-bottom:2px}
  .rdot{width:14px;height:14px;border-radius:50%;background:var(--c)}
  .rname{font-size:16px;font-weight:600}
  .rtimer{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 6px;color:var(--ink);line-height:1}
  .rstate{font-size:12px;color:var(--muted);margin-bottom:18px;display:inline-flex;align-items:center;gap:6px}
  .rphase{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 0}
  .rphase.brk{color:var(--vert)}
  .rgoal{margin:8px auto 20px;max-width:280px}
  .rgbar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
  .rgbar i{display:block;height:100%;width:0;background:var(--c);border-radius:99px;transition:width .6s}
  .rglab{display:block;font-size:13px;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
  .focuswrap .brdone{margin:16px auto 6px}
  .rsum{margin:4px 0 20px;font-size:14px;color:var(--muted)}
  .rreached{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin:0 0 4px}
  .rreached svg{color:var(--primary)}
  .rwarn{font-size:12px;font-weight:600;color:var(--ink);background:var(--bg2);border-radius:9px;
         padding:8px 12px;margin:0 0 14px;display:inline-flex;align-items:center;gap:7px}
  .note{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
        padding:11px 14px;margin-bottom:14px;font-size:13px;color:var(--ink);animation:rise .3s ease backwards}
  .note .nclose{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;display:inline-flex;
                padding:4px;border-radius:8px;flex-shrink:0}
  .note .nclose:hover{color:var(--ink)}
  .undotoast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
             z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 12px 12px 16px;
             display:flex;align-items:center;gap:14px;font-size:13.5px;box-shadow:0 4px 16px rgba(0,0,0,.22);
             max-width:calc(100vw - 32px);animation:rise .2s ease backwards}
  .undotoast button{background:none;border:none;color:var(--bg);font-weight:700;font-family:inherit;font-size:13.5px;
                    cursor:pointer;padding:6px 10px;border-radius:8px;flex-shrink:0;min-height:44px}
  .undotoast button:hover{background:rgba(128,128,128,.25)}
  .rvol{display:flex;align-items:center;gap:11px;margin:0 0 18px;color:var(--muted)}
  /* Graphe façon « temps d'écran » */
  .seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
  .segb{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);
        padding:7px 14px;border-radius:8px;cursor:pointer;min-height:40px;transition:.15s}
  .segb.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .segb:active{transform:scale(.97)}
  .navper{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
  .pnav{background:none;border:1px solid var(--line);border-radius:9px;min-width:40px;min-height:40px;
        display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:.15s}
  .pnav:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .pnav:active:not(:disabled){transform:scale(.95)}
  .pnav:disabled{opacity:.35;cursor:default}
  .plabelw{font-size:13px;font-weight:600;color:var(--ink)}
  .sttotal{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .stsub{font-size:12px;color:var(--muted);margin:3px 0 16px}
  /* Graphe temps : SVG fait main façon « temps d'écran » (grille + axe à droite + moyenne).
     Réutilise .chartsvg/.cg/.cyl/.cxl du graphe de maîtrise ; barres = couleurs des matières. */
  .timesvg{width:100%;height:auto;display:block;margin:2px 0 2px}
  .chartsvg .cavg{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
  .chartsvg .cay{fill:var(--muted);font-size:12px;text-anchor:start}
  .chartsvg rect{transition:none}
  /* Liste des sessions individuelles (vue Jour des Stats) — corriger une session erronée sans console. */
  .dbhist{margin-top:16px}
  .dbhisthead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .dbhisthead h3{font-size:16px;font-weight:700;margin:0}
  .dbtally{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dbmore{margin-top:12px}
  .rcdeb{width:100%;background:none;border:none;font-family:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px;padding:0}
  .rcdeb>span:nth-child(2){flex:1}
  .rcdeb .ic{color:var(--muted)}
  .rcemos{font-size:16px;letter-spacing:1px}
  .dblist{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
  .dbtitle{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 6px}
  .dbcard{padding:8px 0;border-bottom:1px solid var(--line)}
  .dbcard:last-child{border-bottom:none}
  .dbhead{display:flex;align-items:center;gap:10px}
  .dbemo{font-size:18px;line-height:1;width:22px;text-align:center;flex-shrink:0}
  .dbcount{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .dbtasks{list-style:none;margin:6px 0 0 32px;padding:0}
  .dbtasks li{display:flex;align-items:flex-start;gap:7px;font-size:13.5px;padding:2px 0;color:var(--ink);word-break:break-word}
  .dbtasks li .ic{flex-shrink:0;margin-top:2px}
  .dbtasks li.ok .ic{color:var(--vert)}
  .dbtasks li.ko{color:var(--muted)}
  .dbtasks li.ko .ic{color:var(--rouge)}
  .sesslist{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
  .sessrow{display:flex;align-items:center;gap:10px;padding:6px 0}
  .sessdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .sessname{font-size:13px;color:var(--ink);flex-shrink:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sesstime{flex:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .legend{margin-top:6px;border-top:1px dashed var(--line);padding-top:10px}
  .legrow{display:flex;align-items:center;gap:11px;padding:7px 0}
  .legdot{width:15px;height:15px;border-radius:4px;background:var(--c);border:none;cursor:pointer;flex-shrink:0;padding:0;
          box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .12s}
  .legdot:active{transform:scale(.9)}
  .legname{flex:1;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legtime{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  /* Pastille de couleur (modale création) : la couleur choisie ; taper ouvre le sélecteur maison. */
  .nmcolor{display:block;width:100%;height:46px;border-radius:12px;cursor:pointer;padding:0;margin-bottom:16px;
           border:1.5px solid var(--line);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
  /* Sélecteur de couleur maison (popover) */
  .cpickov{position:fixed;inset:0;z-index:70}
  .cpickpanel{position:fixed;width:220px;background:var(--card);border:1px solid var(--line);border-radius:14px;
              box-shadow:0 12px 34px rgba(15,23,42,.28);padding:12px;display:flex;flex-direction:column;gap:10px}
  .cpsv{position:relative;width:100%;height:140px;border-radius:9px;cursor:crosshair;touch-action:none;
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .cpsvthumb{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid #fff;
             box-shadow:0 0 0 1px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
  .cphue{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:8px;cursor:pointer;
         background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .cphue::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
                               background:#fff;border:2px solid rgba(0,0,0,.35);cursor:pointer}
  .cphue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.35);cursor:pointer}
  .cprow{display:flex;align-items:center;gap:9px}
  .cpprev{width:30px;height:30px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .cphex{flex:1;min-width:0;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;
         background:var(--bg2);color:var(--ink);padding:7px 9px;text-transform:uppercase}

  /* ---------- Modale maison (renommer / ajouter / supprimer) ---------- */
  .mdmsg{font-size:14px;color:var(--ink);line-height:1.5;margin:2px 0 16px}
  .mdinput{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;
           padding:12px 14px;font-family:inherit;font-size:16px;outline:none;margin-bottom:16px}
  .mdinput:focus{border-color:var(--primary)}
  .durpick{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .durpick .mdinput{width:70px;margin-bottom:0;text-align:center}
  .durpick span{font-size:14px;color:var(--muted)}
  .mdactions{display:flex;gap:10px;justify-content:flex-end}
  .mdbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px 18px;
         font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;min-height:44px;transition:.15s}
  .mdbtn:hover{border-color:var(--primary)}
  .mdbtn:active{transform:scale(.97)}
  .mdbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .mdbtn.danger{background:var(--rouge);color:#fff;border-color:var(--rouge)}

  /* ---------- Tactile (iPad / iPhone) ---------- */
  button,input,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .cname,.dhead h2{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media (hover:none){
    .mcard:hover,.chap:hover{transform:none}
    .mcard:hover{box-shadow:var(--shadow)}
  }

  /* ---------- Navigation : sidebar à gauche (desktop) ---------- */
  :root{--sbw:230px}   /* largeur de la sidebar */
  /* Contenu large et CENTRÉ dans l'espace restant (max 1160px), marges généreuses → look « logiciel », pas « appli téléphone ». */
  .wrap{max-width:none;margin-left:var(--sbw);
        padding:0 max(48px, calc((100vw - var(--sbw) - 1160px) / 2)) 80px}

  /* ---------- Barre du haut : stats persistantes + CTA (façon tableau de bord) ---------- */
  /* Collée en haut (sticky) : reste visible sur toutes les pages quand on descend. */
  .reevalbanner{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
                min-height:44px;box-sizing:border-box;
                background:var(--rouge);color:#fff;font-weight:700;font-size:14.5px;
                border:none;cursor:pointer;font-family:inherit;padding:13px 16px;
                position:sticky;top:0;z-index:41;text-align:center}
  .reevalbanner:hover{filter:brightness(1.08)}
  .topbar{position:sticky;top:0;z-index:30;background:var(--bg);
          display:flex;align-items:center;gap:34px;margin-bottom:26px;
          padding:30px 0 20px;border-bottom:1px solid var(--line)}
  .tbstat{display:flex;flex-direction:column;gap:3px}
  .tbstat .k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .tbstat .v{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
             display:inline-flex;align-items:center;gap:2px}
  .tbstat .tbflame{display:inline-flex;color:#F97316}   /* même orange que le bandeau série de l'accueil */
  .tbcta{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:12px;
         font-family:inherit;font-size:14.5px;font-weight:600;padding:12px 20px;cursor:pointer;
         display:inline-flex;align-items:center;gap:9px;transition:.15s;box-shadow:var(--shadow)}
  .tbcta:hover{filter:brightness(1.06)}
  .tbcta:active{transform:scale(.98)}
  /* Desktop : la barre du haut couvre déjà Série + Temps → on retire les doublons de l'accueil. */
  @media (min-width:821px){
    #accueil .streak{display:none}
    #accueil .statgrid{grid-template-columns:1fr}
    #accueil .statgrid .statcard:last-child{display:none}
    #accueil .panel{max-width:none}   /* « À faire » / « Aujourd'hui » pleine largeur sur grand écran */
    #accueil .acccta{display:none}     /* « Nouvelle session » de la barre du haut suffit sur desktop */
  }
  .tabbar{position:fixed;top:0;left:0;bottom:0;z-index:40;width:var(--sbw);
          display:flex;flex-direction:column;gap:4px;background:var(--card);
          border-right:1px solid var(--line);padding:18px 14px;overflow-y:auto}
  /* En-tête de marque en haut de la sidebar */
  .sbbrand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700;
           font-size:17px;letter-spacing:-.01em;color:var(--ink)}
  .sbbrand .logo{width:30px;height:30px;border-radius:9px;background:var(--primary);color:#fff;
                 display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sbsect{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
          color:var(--muted);padding:10px 10px 4px;opacity:.7}
  .tab{background:none;border:none;cursor:pointer;font-family:inherit;color:var(--muted);
       display:flex;flex-direction:row;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
       text-align:left;transition:color .15s,background .15s}
  .tab .tabic{display:inline-flex}
  .tab .tabicwrap{position:relative;display:inline-flex}
  .tab .tablbl{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .tabbadge{position:absolute;top:-7px;right:-13px;min-width:22px;height:19px;padding:0 5px;
            border-radius:999px;background:var(--rouge);color:#fff;font-size:11px;font-weight:800;
            display:flex;align-items:center;justify-content:center;line-height:1;
            border:2px solid var(--card)}
  .tab.reevaldue .tablbl{color:var(--rouge)}
  .tab:hover{background:var(--bg2);color:var(--ink)}
  .tab:active{transform:scale(.98)}
  .tab.on{color:var(--primary);background:var(--ring)}
  /* Pied de sidebar : mode offline */
  .sbfoot{margin-top:auto;padding:12px 10px 4px;font-size:12px;font-weight:600;color:var(--muted);
          display:flex;align-items:center;gap:8px}
  .sbfoot .dotlive{width:8px;height:8px;border-radius:50%;background:var(--vert)}

  /* ---------- Repli en barre du bas sur écran étroit (mobile / iPad portrait) ---------- */
  @media (max-width:820px){
    .wrap{margin:0 auto;max-width:920px;padding:30px 22px 118px}
    .topbar{display:none}   /* sur mobile, l'accueil montre déjà série + temps du jour */
    .tabbar{top:auto;left:50%;right:auto;bottom:max(16px,env(safe-area-inset-bottom));
            transform:translateX(-50%);flex-direction:row;gap:2px;width:calc(100% - 28px);max-width:430px;
            height:auto;border:1px solid var(--line);border-radius:22px;padding:7px 8px;
            box-shadow:0 8px 28px rgba(15,23,42,.18);justify-content:space-between;overflow:visible}
    .tab{flex:1;flex-direction:column;gap:3px;padding:6px 2px;border-radius:14px;
         min-height:52px;justify-content:center;align-items:center;text-align:center}
    .tab .tablbl{font-size:12px}
    .tab:hover{background:none;color:var(--muted)}
    .tab.on{background:none;color:var(--primary)}
    .sbbrand,.sbsect,.sbfoot{display:none}   /* pas de marque/pied en mode barre */
  }
  @media (max-width:520px){ .grid .mcard{flex-basis:100%} }   /* cartes pleine largeur sur téléphone (pas de vide à droite) */

  /* ---------- Titres de page ---------- */
  .ptitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 18px}
  .ptitle h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .ptitle .sub{color:var(--muted);font-size:14px;margin-top:3px}
  .addbtn{background:var(--primary);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;
          justify-content:center;width:44px;height:44px;border-radius:12px;flex-shrink:0;transition:.15s}
  .addbtn:hover{filter:brightness(1.07)}
  .addbtn:active{transform:scale(.94)}

  /* ---------- Accueil (tableau de bord) ---------- */
  .hello{margin:2px 0 18px}
  .hello h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em}
  .hello p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .statcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);
            animation:rise .4s cubic-bezier(.22,.61,.36,1) backwards}
  .statcard .lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .statcard .big{font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
  .statcard .big .u{font-size:16px;font-weight:500;color:var(--muted)}
  .statcard .mini{font-size:13px;color:var(--muted);margin-top:6px}
  .seclabel{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
  .seclabel .t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .lk{background:none;border:none;color:var(--primary);font-family:inherit;font-size:13px;font-weight:600;
                cursor:pointer;padding:0}
  .lk:active{transform:scale(.97)}
  .prevlist{display:flex;flex-direction:column;gap:9px}
  .prevrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;background:var(--card);
           border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;
           text-align:left;color:var(--ink);font-family:inherit;animation:rise .4s cubic-bezier(.22,.61,.36,1) backwards;transition:transform .18s}
  .prevrow:active{transform:scale(.99)}
  .prevrow.bosser,.prevrow.reeval{display:flex;padding:0;align-items:stretch;overflow:hidden}
  .bosswork{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;
            padding:12px 14px;background:none;border:0;color:inherit;font-family:inherit;text-align:left;cursor:pointer;transition:transform .18s}
  .bosswork:active{transform:scale(.99)}
  .bossgraph{flex-shrink:0;width:52px;display:flex;align-items:center;justify-content:center;background:none;
             border:0;border-left:1px solid var(--line);color:var(--muted);cursor:pointer;transition:transform .18s}
  .bossgraph:active{transform:scale(.9)}
  .prevrow .pdot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
  .prevrow .pmid{min-width:0}
  .prevrow .pnm{font-size:15px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prevrow .pbar2{height:6px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:6px}
  .prevrow .pbar2>span{display:block;height:100%;border-radius:4px}
  .prevrow .ppct{font-size:16px;font-weight:700;min-width:44px;text-align:right}
  .prevrow .psub{display:block;font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Accueil comme les maquettes (08/11, Eric : « tenir en une page sur ordi », « reprends comme sur les maquettes, ce qu'il y a à droite et à gauche ») :
     ordi = 2 colonnes — à gauche le bonjour, l'arène, les chiffres et le gros bouton ; à droite les tâches du jour et « À travailler ». Mobile : une colonne. */
  .accgrid{display:flex;flex-direction:column}
  .acol{display:contents}
  .acol.right>*{order:1}.accgrid .recapw{order:2}.accgrid .apercu{order:3}   /* mobile : même ordre qu'avant */
  @media (min-width:821px){
    .accgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:start}
    .acol{display:block}
    #accueil .hello{margin:4px 0 18px}
    #accueil .hello h1{font-size:40px;line-height:1.05}
    #accueil .hello p{font-size:15px;margin-top:6px}
    #accueil .arbtns{flex-direction:row;flex-wrap:wrap;margin-bottom:16px}
    #accueil .arbtns .arbtn{width:auto;flex:1 1 0;min-height:42px;white-space:nowrap;font-size:13.5px}
    #accueil .arhero{margin-bottom:8px}
    #accueil .accgrid .statgrid{grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
    #accueil .accgrid .statgrid .statcard:last-child{display:block}
    #accueil .accgrid .statcard{border-radius:20px;padding:18px 18px 16px}
    #accueil .accgrid .statcard .big{font-size:40px}
    #accueil .accgrid .acccta{display:flex;min-height:64px;font-size:17px;border-radius:18px}
    #accueil .accgrid .countdown{margin-bottom:16px}
    .acol.right>.seclabel:first-child{margin-top:6px}
    .acol.right .seclabel{margin:24px 0 10px}
    .acol.right .seclabel .t{font-size:18px;font-weight:700;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
    .acol.right .panel,.acol.right .prevrow{border-radius:18px}
    .acol.right .todaytasks{padding:8px 12px}
    .acol.right .prevlist{gap:10px}
    .acol.right .prevlist .prevrow:nth-child(n+4){display:none}   /* 3 suffisent, comme la maquette */
    .recapw .seclabel{margin:22px 0 10px}.recapw .seclabel .t{font-size:18px;font-weight:700;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
    .recapw .recap{border-radius:18px}
    .recapw .recap.isempty,.recapw .seclabel.recapl.isempty{display:none}
    .acol.right .apercu{display:none}
  }
  .prevrow .pmid .pbar2{display:block;margin-top:7px}
  /* moins de « boîtes dans la boîte » : dans le thème normal, les tâches du jour sont de simples lignes */
  body:not([data-arena]) #accueil .todaytasks .agtxt{background:transparent;border-color:transparent;box-shadow:none}
  body:not([data-arena]) #accueil .todaytasks .agtask+.agtask{border-top:1px solid var(--line)}

  /* ---------- Série (streak) ---------- */
  .streak{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
          border-radius:16px;padding:13px 15px;margin-bottom:14px;box-shadow:var(--shadow);animation:rise .4s ease backwards}
  .streak .fl{display:flex;color:var(--muted);flex-shrink:0}
  .streak .fl.on{color:#F97316}
  .streak .stxt{display:flex;flex-direction:column;min-width:0}
  .streak .stxt .n{font-size:16px;font-weight:700;line-height:1.2}
  .streak .stxt .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* ---------- Compte à rebours des épreuves ---------- */
  .countdown{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;
             margin-bottom:14px;box-shadow:var(--shadow);animation:rise .4s ease backwards}
  .countdown .cdmain{display:flex;align-items:center;gap:13px}
  .countdown .cdic{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:42px;height:42px;
                   border-radius:12px;background:var(--bg2);color:var(--primary)}
  .countdown .cdtxt{display:flex;flex-direction:column;min-width:0;flex:1}
  .countdown .cdlbl{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .countdown .cdnm{font-size:16px;font-weight:700;line-height:1.25;margin-top:1px;display:flex;align-items:center;gap:7px;min-width:0}
  .countdown .cdnm .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .countdown .cdnm .cddot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .countdown .cdsub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .countdown .cdjx{flex-shrink:0;text-align:center;padding:5px 12px;border-radius:11px;background:var(--bg2);line-height:1.05}
  .countdown .cdjx .jn{font-size:19px;font-weight:800;display:block}
  .countdown .cdjx .jl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
  .countdown .cdjx.soon{background:rgba(249,115,22,.13)} .countdown .cdjx.soon .jn{color:var(--orange)}
  .countdown .cdjx.today{background:rgba(22,163,74,.14)} .countdown .cdjx.today .jn{color:var(--vert)}
  .countdown .cdrest{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .countdown .cdchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
                     background:var(--bg2);border-radius:999px;padding:5px 11px;color:var(--ink)}
  .countdown .cdchip .cddot{width:8px;height:8px;border-radius:50%}
  .countdown .cdchip .cdj{color:var(--muted);font-weight:700}
  /* chip « date d'épreuve » sur la page détail */
  .examchip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
            border-radius:999px;padding:8px 14px;min-height:40px;box-sizing:border-box;font-size:13px;font-weight:600;
            color:var(--ink);cursor:pointer;box-shadow:var(--shadow);margin:2px 0 4px}
  .examchip:active{transform:scale(.97)} .examchip .exic{color:var(--primary);display:flex}
  .examchip.none{color:var(--muted);font-weight:500} .examchip .exj{color:var(--muted);font-weight:700}

  /* ---------- Recap du jour ---------- */
  .recap{padding:14px 16px;display:flex;flex-direction:column;gap:9px;animation:rise .4s ease backwards}
  .recap .rcline{display:flex;align-items:center;gap:9px;font-size:14px;line-height:1.35;color:var(--ink)}
  .recap .rcline .ic{color:var(--muted);flex-shrink:0}
  .recap .rcline .cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .recap .rchips{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 0 2px 25px}
  .recap .rchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;
                padding:4px 10px;font-size:12.5px;color:var(--ink)}
  .recap .rchip .cdot{width:8px;height:8px;border-radius:50%}
  .rcempty{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
  .recap .rcmore{font-size:13px;color:var(--muted);font-style:italic}

  /* ---------- To-do ---------- */
  .todo{padding:6px 14px 14px;animation:rise .4s ease backwards}
  .todogroup{padding-top:8px}
  .todoglabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 2px}
  .todorow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line)}
  .todogroup .todorow:last-child{border-bottom:none}
  .todochk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--card);
           display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:#fff;transition:.15s}
  .todochk .ic{opacity:0;transition:opacity .15s}
  .todochk.on{background:var(--vert);border-color:var(--vert)}
  .todochk.on .ic{opacity:1}
  .todotxt{font-size:14.5px;line-height:1.3;word-break:break-word}
  .todotxt.done{text-decoration:line-through;color:var(--muted)}
  .tododel{color:var(--muted);width:34px;height:34px}
  .todoseg{display:flex;gap:8px;margin:14px 0 8px}
  .tseg{flex:1;background:var(--bg2);border:1.5px solid transparent;border-radius:999px;padding:8px 10px;
        font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;min-height:40px;transition:.15s}
  .tseg.on{background:var(--primary);color:#fff}
  .todoadd{display:flex;gap:8px}
  .todoadd input{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;
                 padding:11px 13px;font-family:inherit;font-size:16px;outline:none;min-width:0}
  .todoadd input:focus{border-color:var(--primary)}
  .addbtn{background:var(--primary);color:#fff;border:none;border-radius:12px;width:46px;flex-shrink:0;
          display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .addbtn:active{transform:scale(.95)}

  /* ---------- Agenda (onglet Session) ---------- */
  .sessionwrap.withag{min-height:auto;display:block;margin-bottom:0}
  .agendacard{padding:16px}
  .aghdr{display:flex;align-items:center;gap:9px;color:var(--ink);margin-bottom:4px}
  .aghdr .ic{color:var(--primary)}
  .aghdr h3{margin:0;font-size:17px;font-weight:700}
  .agnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
  .agarrow{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
           display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .agarrow:active{transform:scale(.94)}
  .agarrow:disabled{opacity:.35;cursor:default}
  .aglabel{font-size:14.5px;font-weight:700;min-width:150px;text-align:center}
  .aglist{display:flex;flex-direction:column;gap:2px}
  .agday{padding:10px 0}
  .agday+.agday{border-top:1px solid var(--line)}
  .agday.today .aghead{color:var(--primary)}
  .aghead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);
          text-transform:uppercase;letter-spacing:.03em;margin:4px 0 4px}
  .aghead .agdow{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;
                 background:var(--bg2);color:var(--ink);font-size:12px}
  .agday.today .aghead .agdow{background:var(--primary);color:#fff}
  .agempty{font-size:13px;color:var(--muted);opacity:.75;padding:2px 0 2px 28px}
  .agtask{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:5px 0}
  .agtxt{display:flex;align-items:center;gap:9px;min-width:0;background:var(--bg2);border:1px solid var(--line);
         border-radius:11px;padding:10px 12px;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;transition:.15s}
  .agtxt:active{transform:scale(.99)}
  .agtxt .cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .agtxt .agname{font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-word;flex:1}
  .agtxt.done{opacity:.6}
  .agtxt.done .agname{text-decoration:line-through;color:var(--muted)}
  .agtxt .agplay{display:inline-flex;color:var(--primary);flex-shrink:0;margin-left:auto}
  .agbox{min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:2px 0 6px}
  .agbox .aghd{background:none;border:none;width:100%}
  .agbox.done{opacity:.6}
  .agname.agmat{font-weight:700}
  .agbox .agstep{width:100%;padding:4px 12px 4px 30px}
  .agnew{margin:0;min-height:52px;background:var(--bg2);color:var(--primary);border:1.5px dashed color-mix(in srgb,var(--primary) 45%,var(--line));font-size:15px;font-weight:700;padding:14px}
  .agpanel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;border-bottom:1px solid var(--line)}
  .agpanel .matchip.mini,.agpanel .agdaypick,.agpanel .optchip{background:var(--card)}
  .agpanel .agdaypick.on{background:var(--primary)}
  .agpanelhd{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 8px}.agpanelhd b{font-size:16px}
  .aghint{font-size:13px;color:var(--muted);margin:-4px 0 10px}
  .agitems{margin:0 0 8px}.agitems .agn{display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--card);align-items:center;justify-content:center;font-size:12px;margin-right:9px;color:var(--muted)}
  .aginput{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:16px;outline:none}
  .aginput:focus{border-color:var(--primary)}

  /* ---------- Arène 1 (néo-brutal) ----------
     Élément 0 = appli grise (ARENAS[0].look). Chaque .asN ajoute un morceau ; au 10, le look de la maquette e-brutal est complet.
     Seul le STYLE change : aucun texte de la maquette (« RÉVISE.EXE », « Ça pique »…) n'entre dans l'appli. */
  /* 1 Le papier (couleurs : ARENAS[0].lv) */

  body[data-arena=brutal].as2 :is(.mcard,.chap,.chartbox,.panel,.card,.statcard,.prevrow,.streak,.countdown,.countcard,#reglages .secblock,.arcard,.agtxt:not(.aghd),.agbox){border:3px solid #000;border-radius:14px}

  /* ---------- Arène 2 : Widgets ----------

  .ar-wbg{position:absolute;inset:-10%;background:radial-gradient(40% 40% at 75% 85%,#FF5FA2bb 0%,transparent 70%),radial-gradient(60% 50% at 10% 5%,#FF7A59 0%,transparent 60%),radial-gradient(60% 60% at 95% 30%,#6A5CFF 0%,transparent 62%),radial-gradient(60% 50% at 30% 100%,#00B3A4 0%,transparent 62%),#2A1F4A}

  body[data-arena=widgets].as3 :is(.chartbox,.panel,.statcard,.streak,.countdown,.countcard,#reglages .secblock,.authcard,.arcard,.tabbar,.cpickpanel){
    backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4)}
  body[data-arena=widgets].as3 :is(.mcard,.chap,.prevrow){background-color:rgba(255,255,255,.17)}
  /* barre du haut : translucide sur le fond de l'arène (plus de rectangle plein) */
  body[data-arena=widgets] .topbar{background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}

  body[data-arena=widgets].as4 .statcard .big{font-size:40px;font-weight:800}
  body[data-arena=widgets].as4 :is(.cta,.tbcta,.bigwork,.authcta,.arbtn:not(.soft)){background:#fff;color:#2A1F4A;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  body[data-arena=widgets].as4 :is(.addbtn,.mdbtn.primary,.tseg.on,.sbbrand .logo,.agday.today .aghead .agdow,.authbrand .logo):not(:disabled){color:#2A1F4A}
  body[data-arena=widgets].as4 :is(.agdaypick.on span,.agdaypick.on b,.rbchip.on span,.rbchip.on b){color:#2A1F4A}

    background-size:250% 100%,100% 100%;background-repeat:no-repeat;animation:arSheen 6s ease-in-out infinite}

  @media (max-width:820px){ body[data-arena=widgets].as6 .ar-wbg{animation-duration:45s} body[data-arena=widgets] .ar-bub{animation-duration:36s} }   /* plus lent sur mobile : moins de flou à recalculer */

function arenaIdx(){ const i=(typeof data!=='undefined'&&data.arena)||0; return Math.min(Math.max(0,i),ARENAS.length-1); }

function arenaStep(i){ return Math.max(0,Math.min(10,Math.floor((totalWorkH()-arenaStart(i))/ARENAS[i].d*10+1e-9))); }
function arenaLook(){ return document.body.dataset.arena||null; }
// Étape affichée : un élément gagné n'apparaît dans l'appli qu'une fois révélé (carte « ??? »), pas avant.
function arenaVisStep(){ const i=arenaIdx(), S=arenaStep(i), v=typeof data!=='undefined'?readArenaSeen():null; return v&&v.i===i?Math.min(S,v.s):S; }
// Couleurs de l'arène à l'étape n : base grise + ce qu'ajoutent les éléments atteints (cumulés).
function arenaVars(i,n){ const A=ARENAS[i], v={...A.look.vars}; for(let k=1;k<=n;k++) Object.assign(v,(A.lv||{})[k]||{}); return v; }
// Une étape de l'arène est-elle visible ? (look de l'arène actif + étape atteinte et révélée)
function arOn(k,n){ return arenaLook()===k && (arHoldLook?arHoldVis:arenaVisStep())>=n; }

// Bannière d'une arène (Accueil + route) : chaque arène a son propre habillage, quel que soit le thème choisi.
function arenaBanner(i, inner){
  const A=ARENAS[i];
  return `<div class="rb ${A?'rb-'+A.k:'rb-lock'}">${inner}</div>`;
}
// Arènes affichées ou non (réglage de l'appareil, Réglages → Apparence). Masquées = pas de bannière ni de révélations.

function arenasOn(){ try{ return localStorage.getItem(ARENA_OFF_KEY)!=='1'; }catch(e){ return true; } }
function setArenasOn(on){
  try{ on?localStorage.removeItem(ARENA_OFF_KEY):localStorage.setItem(ARENA_OFF_KEY,'1'); }catch(e){}
  let th=''; try{ th=localStorage.getItem(THEME_KEY)||''; }catch(e){}
  if(!on && th==='arene') applyTheme('slate');
  render(); if(on) queueStepReveal();
}
// Bannière de l'arène en haut de l'Accueil → ouvre la route.
function arenaCard(){
  const i=arenaIdx(), A=ARENAS[i], S=arenaVisStep(), last=i===ARENAS.length-1;
  // éléments pas encore révélés : la pastille et le texte ne les annoncent pas (surprise de la carte qui se retourne)
  const into=Math.min((totalWorkH()-arenaStart(i))/A.d*10, 10);   // la barre suit les heures (un segment atteint mais pas encore révélé reste plein : il ne redescend plus)
  const seg=Array.from({length:10},(_,k)=>`<i><b style="width:${Math.max(0,Math.min(1,into-k))*100}%"></b></i>`).join('');
  const left=arenaStart(i)+(arenaStep(i)+1)*A.d/10-totalWorkH();
  const foot = S<arenaStep(i) ? `<b>Nouvel élément à découvrir !</b>` : S>=10 ? (last?'<b>Arène complète !</b> Les prochaines arrivent bientôt.':`<b>Arène complète !</b> Le portail est ouvert.`)
    : `<b>Étape ${S} / 10</b> · prochain élément dans ${fmtDur(left*3600000).replace(/ /g,'\u00a0')}`;
  const look=arenaLook()===A.k;
  return `<button class="arhero" onclick="openRoad()" aria-label="${A.nom} : voir ma route">${arenaBanner(i,`
      <div class="ahrow"><div class="rbemb">${ARENA_EMBLEMS[A.k]||''}</div>
        <div class="ahmid"><small>${escapeH(A.desc)}</small><div class="rbname">${A.nom}</div></div>
        <span class="rbpill">${S} / 10</span><span class="ahgo">${ic('chevron',18)}</span></div>
      <div class="arseg">${seg}</div>
      <div class="rbsub">${foot}</div>`)}</button>
    <div class="arbtns">
      ${S>=10&&!last?`<button class="arbtn portal" onclick="enterNextArena()">Passer le portail →</button>`:''}
      ${!look?`<button class="arbtn soft" onclick="applyTheme('arene');render()">Mettre le style de l'arène</button>`:''}
    </div>`;
}

// ---------- Route des arènes : plein écran par-dessus l'Accueil (départ en bas, on monte) ----------
let lastRoadH=null;   // position du pion au dernier affichage (pour l'animer jusqu'à la nouvelle)
function roadOpen(){ const el=document.getElementById('arenes'); return !!el && !el.classList.contains('hidden'); }
function openRoad(){ document.getElementById('arenes').classList.remove('hidden'); document.body.style.overflow='hidden'; renderArenes(); }
function closeRoad(){ document.getElementById('arenes').classList.add('hidden'); document.body.style.overflow=''; }
function renderArenes(){
  const el=document.getElementById('arenes');
  const cur=arenaIdx(), H=totalWorkH(), last=ARENAS.length-1;
  const capH=Math.max(arenaStart(cur), Math.min(H, arenaStart(cur)+ARENAS[cur].d));   // on ne dépasse pas le portail tant qu'on ne l'a pas passé
  const S=arenaStep(cur), left=arenaStart(cur)+(S+1)*ARENAS[cur].d/10-H;
  let html=arenaBanner(-1,`<div class="rbtop"><small>Arène ${ARENAS.length+1}</small><span class="rbpill">${ic('lock',14)} bientôt</span></div>
    <div class="rbname">???</div><div class="rbsub">Une nouvelle arène arrive.</div>`);
  for(let i=last;i>=0;i--){
    const A=ARENAS[i], st=arenaStart(i), known=i<=cur;
    for(let n=10;n>=1;n--){
      const lo=st+(n-1)*A.d/10, hi=st+n*A.d/10, ok=known && capH>=hi-1e-9;
      html+=`<div class="rrow ${n%2?'l':'r'}${ok?' ok':''}" data-i="${i}" data-n="${n}" data-lo="${lo}" data-hi="${hi}">
        <span class="rnode">${ok?ic('check',16):n}</span>
        <span class="rlab"><b>${ok?escapeH(A.steps[n-1]):'???'}</b><small>${fmtH(hi)}</small></span></div>`;
    }
    const ready=i===cur+1 && arenaStep(cur)>=10;
    const chip = i<cur?`${ic('check',14)} terminée` : i===cur?'tu es ici' : ready?'portail ouvert' : `${ic('lock',14)} dès ${fmtH(st)}`;
    html+=arenaBanner(known||ready?i:-1,`<div class="rbtop"><small>${i?'':'Départ'}</small><span class="rbpill">${chip}</span></div>
      <div class="rbname">${known||ready?A.nom:'???'}</div>
      <div class="rbsub">${known||ready?A.desc+' ':''}${A.d} h pour la remplir.</div>
      ${ready?`<button class="arbtn portal" onclick="enterNextArena()">Passer le portail →</button>`:''}`);
  }
  el.innerHTML=`<div class="roadhead"><div><b>Route des arènes</b>
      <small>${fmtDur(H*3600000)} de travail · ${S>=10?(cur<last?'portail ouvert !':'tout est débloqué'):`prochain élément dans ${fmtDur(left*3600000)}`}</small></div>
      <button class="roadx" onclick="closeRoad()" aria-label="Fermer la route">${ic('x',22)}</button></div>
    <div class="road" id="road"><div class="rrail"></div><div class="rfill" id="roadFill"></div>
      <div class="rme" id="roadMe"><span class="av">${ic('flame',20)}</span></div>${html}</div>`;
  // Pion : part de l'ancienne position (ou du début de l'arène) et monte jusqu'à la nouvelle.
  const road=document.getElementById('road'), me=document.getElementById('roadMe'), fill=document.getElementById('roadFill');
  const yOf=h=>{
    const rows=[...road.querySelectorAll('.rrow')].filter(r=>+r.dataset.i<=cur);
    let r=rows.find(r=>h>=+r.dataset.lo && h<+r.dataset.hi), f;
    if(!r){ r=rows.find(r=>+r.dataset.i===cur && +r.dataset.n===10); f=1; }
    else f=(h-r.dataset.lo)/(r.dataset.hi-r.dataset.lo);
    return r.offsetTop + r.offsetHeight*(1-f);
  };
  const from=lastRoadH===null||lastRoadH>capH||lastRoadH<arenaStart(cur) ? arenaStart(cur) : lastRoadH;
  const place=y=>{ me.style.top=y+'px'; fill.style.height=(road.offsetHeight-y)+'px'; };
  road.classList.add('still'); place(yOf(from)); void road.offsetWidth; road.classList.remove('still');
  const yEnd=yOf(capH); lastRoadH=capH;
  requestAnimationFrame(()=>place(yEnd));
  setTimeout(()=>{ const top=road.getBoundingClientRect().top-el.getBoundingClientRect().top+el.scrollTop+yEnd-el.clientHeight/2;
    el.scrollTo({top:Math.max(0,top), behavior:'smooth'}); },0);
}
function fmtH(h){ return fmtDur(Math.round(h*60)*60000); }
// Widgets Accueil de l'arène Widgets (anneau du jour + semaine en barres, élément 7 « Les widgets »).
function arenaWidgets(){
  if(!arOn('widgets',7)) return '';
  const w=todayWorkMs(), goal=2*3600000, p=Math.min(1,w/goal), C=2*Math.PI*36;
  const ring=`<div class="w"><div class="ring">
      <svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="36" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="10"/>
      <circle cx="44" cy="44" r="36" fill="none" stroke="#FFD76A" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 44 44)"/></svg>
      <div><div class="lab">Aujourd'hui</div><b>${fmtDur(w)}</b><small>${Math.round(p*100)} % de 2 h</small></div></div></div>`;
  let bars='';
  {
    const t0=localDay(Date.now()), days=Array.from({length:7},(_,k)=>addDays(t0,k-6));
    const ms=days.map(d=>{ const e=addDays(d,1); return (data.sessions||[]).reduce((s,x)=>{ const t=Date.parse(x.start);
      return (x.end&&t>=d&&t<e)?s+Math.max(0,Date.parse(x.end)-t):s; },0); });
    const mx=Math.max(...ms,1), tot=ms.reduce((a,b)=>a+b,0);
    bars=`<div class="w"><div class="lab">7 derniers jours · ${fmtDur(tot)}</div>
      <div class="days">${ms.map((v,k)=>`<i class="${k===6?'td':''}" style="height:${Math.max(6,v/mx*100)}%"></i>`).join('')}</div>
      <div class="dl">${days.map(d=>`<span>${'DLMMJVS'[new Date(d).getDay()]}</span>`).join('')}</div></div>`;
  }
  return `<div class="arwid">${ring}${bars}</div>`;
}
// Décor global (fond + éléments posés sur l'écran) et classes d'étapes sur <body>. Appelée à chaque render().
function updateArena(){
  if(arHoldLook) return;   // portail en cours : l'ancien look reste affiché jusqu'à la transformation
  if(arenaLook() && arenaLook()!==ARENAS[arenaIdx()].k){ applyTheme('arene'); return; }   // data a changé d'arène sans passer par applyTheme
  const k=arenaLook(), i=arenaIdx(), S=k?arenaVisStep():0;
  for(let n=1;n<=10;n++) document.body.classList.toggle('as'+n, !!k && n<=S);
  if(k && document.body.dataset.arv!==String(S)){   // couleurs de l'étape (base grise + éléments atteints)
    const root=document.documentElement; Object.entries(LIGHT_DEFAULTS).forEach(([a,b])=>root.style.setProperty(a,b));
    Object.entries(arenaVars(i,S)).forEach(([a,b])=>root.style.setProperty(a,b)); document.body.dataset.arv=S; }
  if(!k) delete document.body.dataset.arv;
  let bg=document.getElementById('arenaBg'), dc=document.getElementById('arenaDeco');
  if(!bg){ bg=document.createElement('div'); bg.id='arenaBg'; document.body.prepend(bg); }
  if(!dc){ dc=document.createElement('div'); dc.id='arenaDeco'; document.body.appendChild(dc); }
  const want=(k||'')+':'+S;
  if(dc.dataset.v!==want){
    const prev=dc.dataset.v||'', prevS=prev.split(':')[0]===k?+prev.split(':')[1]:S;
    let b='', d=[];   // d : [étape, html]
    const rnd=n=>((Math.sin(n*12.9898)*43758.5453)%1+1)%1;   // positions stables d'un affichage à l'autre
    if(k==='brutal'){
      if(S>=10) b+=[['8%','72%',70,'#7FB8FF','<circle cx="50" cy="50" r="40"/>'],['86%','14%',64,'#FF90E8','<path d="M50 8L92 88H8z"/>'],
        ['90%','62%',56,'#7CF5A5','<rect x="12" y="12" width="76" height="76" rx="6"/>'],['4%','28%',58,'#FFD43B','<path d="M10 60q15-40 30 0t30 0t30 0" fill="none" stroke-width="10"/>'],
        ['60%','90%',48,'#FFD43B','<path d="M50 6l12 30 32 2-25 20 9 32-28-18-28 18 9-32L6 38l32-2z"/>']]
        .map(([l,t,w,c,sh],n)=>`<svg class="ar-shape armob" viewBox="0 0 100 100" style="left:${l};top:${t};width:${w}px;height:${w}px;fill:${c};animation-delay:-${n*1.4}s">${sh}</svg>`).join('');
      d=[[10,'<svg class="ar-sticker" viewBox="0 0 100 100"><path d="M50 4l10 16 18-6-2 19 18 7-13 14 13 14-18 7 2 19-18-6-10 16-10-16-18 6 2-19-18-7 13-14L4 54l18-7-2-19 18 6z" fill="#FFD43B" stroke="#000" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="50" r="14" fill="#FF90E8" stroke="#000" stroke-width="4"/></svg>']];
    }
    if(k==='arcade'){
      if(S>=1) b='<div class="ar-grid"></div>';
      if(S>=10){ const pc=['#fff','#FF4FD8','#4DE1FF','#FFE14D','#3DFF8B'];
        b+=Array.from({length:90},(_,n)=>`<span class="ar-pix${n%3?'':' c'}" style="position:absolute;left:${rnd(n)*100}%;top:${rnd(n+40)*100}%;animation-delay:${rnd(n+7)*2.6}s;background:${pc[n%5]};opacity:.85"></span>`).join(''); }
      d=[[10,'<div class="ar-sweep"></div>']];
    }
    if(k==='widgets'){
      if(S>=2) b='<div class="ar-wbg"></div>';
      if(S>=6) b+=[['#FF7A59','-5%','10%',420],['#6A5CFF','60%','-10%',480],['#00D1B8','30%','60%',380]]
        .map(([c,l,t,w],n)=>`<span class="ar-orb" style="left:${l};top:${t};width:${w}px;height:${w}px;background:${c};animation-delay:-${n*5}s"></span>`).join('');
      if(S>=10) b+='<div class="ar-aur" style="position:absolute"></div>';
      if(S>=9) b+=Array.from({length:80},(_,n)=>`<span class="ar-star${n%6?'':' big'}" style="position:absolute;left:${rnd(n)*100}%;top:${rnd(n+50)*100}%;animation-delay:${rnd(n+9)*3}s"></span>`).join('')
        +Array.from({length:9},(_,n)=>`<span class="ar-spk" style="left:${rnd(n+70)*100}%;top:${rnd(n+90)*100}%;font-size:${14+rnd(n+3)*16}px;animation-delay:${rnd(n+5)*2.4}s">✦</span>`).join('')
        +'<span class="ar-shoot"></span>';
      if(S>=8) b+=Array.from({length:14},(_,n)=>{ const s=36+rnd(n+3)*110;   // bulles qui montent derrière le contenu, jamais par-dessus le texte
        return `<span class="ar-rise" style="left:${rnd(n+21)*96}%;width:${s}px;height:${s}px;animation-duration:${22+rnd(n+11)*16}s;animation-delay:-${rnd(n+7)*38}s"></span>`; }).join('');
    }
    bg.innerHTML=b;
    dc.innerHTML=d.filter(([n])=>S>=n).map(([n,h])=>n>prevS?h.replace(/^<(\w+) class="/,'<$1 class="ardeco-new '):h).join('');
    dc.dataset.v=want;
  }
  arenaSideWidget(k==='widgets' && S>=7);
  arenaSideDeco(k==='brutal'&&S>=10 ? '<svg class="ar-shape" viewBox="0 0 100 100" style="left:18px;bottom:120px;width:74px;height:74px;fill:#7FB8FF"><circle cx="50" cy="50" r="40"/></svg>'
      +'<svg class="ar-shape" viewBox="0 0 100 100" style="left:110px;bottom:170px;width:70px;height:70px;fill:#FF90E8;animation-delay:-2s"><path d="M50 8L92 88H8z"/></svg>'
      +'<svg class="ar-shape" viewBox="0 0 100 100" style="left:96px;bottom:40px;width:84px;height:84px;fill:#FFFFFF;animation-delay:-4s"><path d="M50 6l12 30 32 2-25 20 9 32-28-18-28 18 9-32L6 38l32-2z"/></svg>'
      +'<svg class="ar-shape" viewBox="0 0 100 100" style="left:24px;bottom:236px;width:56px;height:56px;fill:#7CF5A5;animation-delay:-5s"><rect x="12" y="12" width="76" height="76" rx="6"/></svg>'
    : k==='arcade'&&S>=10 ? arFloorSVG() : '');
  // Nouvel élément atteint → mini-révélation (dès que l'écran est libre). « vu » n'avance qu'une fois l'élément révélé.
  const seenRaw=readArenaSeen(), Sx=arenaStep(i);

  else if(Sx>seenRaw.s) queueStepReveal();
}
// Petit widget « Aujourd'hui » dans la barre latérale (Arène 2, élément 7) : visible sur toutes les pages (ordi).

// Sol quadrillé en perspective (Arène 3, élément 10) — dessiné en SVG : une vraie 3D CSS disparaissait sous la barre latérale dans Safari.
function arFloorSVG(){

  [2,7,15,27,44,66,94,128].forEach(y=>l+=`<line x1="-10" y1="${y}" x2="250" y2="${y}"/>`);
  return `<svg class="ar-floor" viewBox="0 0 240 130" preserveAspectRatio="none"><g stroke="#FF4FD8" stroke-width="1.6" opacity=".85">${l}</g><line x1="0" y1="1" x2="240" y2="1" stroke="#FFE14D" stroke-width="2"/></svg>`;
}
// Décor posé dans le bas de la barre latérale (ordi), visible sur toutes les pages : formes (Arène 1), soleil + sol (Arène 3).
function arenaSideDeco(html){
  const tb=document.getElementById('tabbar'); if(!tb) return;

function readArenaSeen(){ try{ return JSON.parse(localStorage.getItem(ARENA_SEEN_KEY)||'null'); }catch(e){ return null; } }
function writeArenaSeen(v){ try{ localStorage.setItem(ARENA_SEEN_KEY, JSON.stringify(v)); }catch(e){} }
// Toutes les arènes : étapes déjà gagnées en clair, les autres en « ??? ».
