    if(!('mat' in t)) t.mat=null;
    delete t.when;
    if(!(Number.isInteger(t.est) && t.est>0)) delete t.est;   // durée estimée (minutes), facultative
    if(t.spent!==undefined && !(Number.isFinite(+t.spent) && +t.spent>=0)) delete t.spent; else if(t.spent!==undefined) t.spent=Math.round(+t.spent);
    if(Array.isArray(t.steps)){ t.steps=t.steps.filter(x=>x && typeof x==='object').map(x=>({txt:String(x.txt??''), done:!!x.done})); if(!t.steps.length) delete t.steps; } else delete t.steps;   // étapes (sous-tâches)
  });
  const used=new Set((d.matieres||[]).map(m=>m.color).filter(Boolean));
  (d.matieres||[]).forEach((m,i)=>{
    if(!m.id) m.id=genId(i);
    if(!m.color) m.color=pickColor(used);
  });
  return d;
}
// La courbe se construit toute seule dans le temps : pour chaque chapitre, on ajoute
// un point par jour (à la dernière valeur connue) entre le dernier point enregistré et
// aujourd'hui. Idempotent. Lancé à chaque chargement/import.
function backfillDaily(d){
  const todayStr=dateKey(Date.now());   // jour LOCAL (aligné sur les sessions et l'agenda)
  (d.matieres||[]).forEach(m=>(m.chapitres||[]).forEach(c=>{
    const h=c.hist;
    if(!Array.isArray(h)||!h.length) return;
    h.sort((a,b)=>new Date(a.t)-new Date(b.t));
    // 1) la courbe atteint aujourd'hui : un point « aujourd'hui » à la dernière valeur connue
    const last=h[h.length-1];
    if(last.t.slice(0,10) < todayStr) h.push({t:todayStr+'T12:00:00.000Z', p:last.p});
    // 2) compactage : on retire les points intermédiaires égaux à leurs DEUX voisins.
    //    Un palier plat ne garde que ses deux extrémités → stockage borné au nombre de
    //    changements (plus O(jours)), tout en conservant exactement la forme en marches.
    if(h.length<=2) return;
    const out=[h[0]];
    for(let i=1;i<h.length-1;i++){ if(!(h[i].p===h[i-1].p && h[i].p===h[i+1].p)) out.push(h[i]); }
    out.push(h[h.length-1]);
    c.hist=out;
  }));
  return d;
}

// ---------- Compte & synchronisation cloud (Supabase, en fetch() brut — pas de SDK) ----------
// Principe : le localStorage reste la source de vérité IMMÉDIATE (jamais bloqué par le réseau) ;
// la synchro cloud est un best-effort asynchrone qui pousse/tire en tâche de fond.
// Hors du site en ligne (file://, localhost, aperçu…) : jamais de vrai Supabase, même avec les bonnes clés —
// évite qu'un test local (même email que le vrai compte) n'écrase les données réelles (incident du 05/09).
function supaConfigured(){ return location.hostname==='simonnivoix.github.io'
  && SUPABASE_URL.indexOf('YOUR-PROJECT')===-1 && SUPABASE_ANON_KEY.indexOf('YOUR-ANON-KEY')===-1; }
const SUPA_REST = 'https://'+SUPABASE_URL.replace(/^https?:\/\//,'');

function loadAuth(){ try{ const r=JSON.parse(localStorage.getItem(AUTH_KEY)); if(r && r.access_token) return r; }catch(e){} return null; }
function saveAuth(s){ localStorage.setItem(AUTH_KEY, JSON.stringify(s)); }
function clearAuth(){ localStorage.removeItem(AUTH_KEY); }
function loadSyncMeta(){ try{ const r=JSON.parse(localStorage.getItem(SYNC_KEY)); if(r && typeof r==='object') return r; }catch(e){} return {migrated:false, lastLocalChangeAt:null}; }
function saveSyncMeta(m){ localStorage.setItem(SYNC_KEY, JSON.stringify(m)); }

let authSession = loadAuth();                         // {access_token, refresh_token, expires_at, user:{id,email}}
let authState = authSession ? 'offline' : 'anon';      // 'anon' | 'online' | 'offline' — optimiste, confirmé au 1er sync/refresh réussi
let refreshTimer = null, syncTimer = null, syncPending = false, authErr = '';
let recoverySession = null;                            // token temporaire du lien "mot de passe oublié" (voir parseRecoveryHash)

function authHeaders(){ return {apikey:SUPABASE_ANON_KEY, Authorization:'Bearer '+(authSession?authSession.access_token:'')}; }
function applySession(s){
  authSession = {access_token:s.access_token, refresh_token:s.refresh_token,
    expires_at: Date.now() + (s.expires_in||3600)*1000, user:{id:s.user.id, email:s.user.email}};
  saveAuth(authSession); authState='online'; scheduleRefresh();
}

// Confirmation d'email ACTIVÉE côté Supabase : l'inscription ne renvoie pas de session tant que
// le lien reçu par mail n'a pas été cliqué. Renvoie 'confirmed' (session ouverte) ou 'pending' (mail envoyé).
async function signup(email,password){
  if(!supaConfigured()) throw new Error("Comptes indisponibles ici.");
  const r=await fetch(SUPA_REST+'/auth/v1/signup', {method:'POST',
    headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || "Inscription impossible");
  if(j.access_token){ applySession(j); return 'confirmed'; }
  return 'pending';
}
async function login(email,password){
  if(!supaConfigured()) throw new Error("Comptes indisponibles ici.");
  const r=await fetch(SUPA_REST+'/auth/v1/token?grant_type=password', {method:'POST',
    headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok || !j.access_token) throw new Error(j.error_description || "Email ou mot de passe incorrect");
  applySession(j);
}
function translateAuthErr(msg){
  if(/not confirmed/i.test(msg)) return "Confirme d'abord ton email (regarde tes mails, y compris les indésirables), puis reconnecte-toi.";
  if(/invalid login credentials/i.test(msg)) return "Email ou mot de passe incorrect.";
  if(/already registered|user already exists/i.test(msg)) return "Un compte existe déjà avec cet email — connecte-toi plutôt.";
  if(/failed to fetch|load failed|networkerror/i.test(msg)) return "Pas de connexion internet — réessaie plus tard.";
  return msg;
}
// Mot de passe oublié : demande un email de récupération (GoTrue renvoie 200 même si l'email n'existe pas, pour ne pas révéler les comptes).
async function requestReset(email){
  if(!supaConfigured()) throw new Error("Comptes indisponibles ici.");
  const r=await fetch(SUPA_REST+'/auth/v1/recover', {method:'POST',
    headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'}, body:JSON.stringify({email})});
  if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.error_description || j.msg || "Envoi impossible"); }
}
// Applique le nouveau mot de passe avec le token temporaire du lien reçu par mail, puis ouvre une vraie session.
async function updatePassword(newPw){
  if(!supaConfigured()) throw new Error("Comptes indisponibles ici.");
  if(!recoverySession) throw new Error('Lien invalide ou expiré, redemande un email.');
  const r=await fetch(SUPA_REST+'/auth/v1/user', {method:'PUT',
    headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json',Authorization:'Bearer '+recoverySession.access_token},
    body:JSON.stringify({password:newPw})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || "Impossible de changer le mot de passe");
  applySession({access_token:recoverySession.access_token, refresh_token:recoverySession.refresh_token,
    expires_in:recoverySession.expires_in, user:{id:j.id, email:j.email}});
}
// Le lien de récupération redirige vers cette page avec un fragment #access_token=…&type=recovery (implicit flow GoTrue).
function parseRecoveryHash(){
  if(!location.hash) return null;
  const p=new URLSearchParams(location.hash.slice(1));
  if(p.get('type')!=='recovery' || !p.get('access_token')) return null;
  return {access_token:p.get('access_token'), refresh_token:p.get('refresh_token'), expires_in:+(p.get('expires_in')||3600)};
}
async function refreshSession(){
  if(!supaConfigured() || !authSession || !authSession.refresh_token) return;
  try{
    const r=await fetch(SUPA_REST+'/auth/v1/token?grant_type=refresh_token', {method:'POST',
      headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'}, body:JSON.stringify({refresh_token:authSession.refresh_token})});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.access_token){ applySession(j); if(syncPending) flushSync(); }
    else authState='offline';
  }catch(e){ authState='offline'; }
}
function scheduleRefresh(){
  clearTimeout(refreshTimer);
  if(!authSession) return;
  refreshTimer=setTimeout(refreshSession, Math.max(5000, authSession.expires_at - Date.now() - 5*60000));
}
async function logout(){
  try{ if(authSession) await fetch(SUPA_REST+'/auth/v1/logout?scope=local', {method:'POST', headers:authHeaders()}); }catch(e){}
  clearTimeout(refreshTimer); clearAuth(); authSession=null; authState='anon';
  // Efface les données de CET appareil (pas celles du cloud) : sur un appareil partagé, la personne
  // suivante ne doit jamais hériter/mélanger les données de ce compte avec le sien.
  localStorage.removeItem(SYNC_KEY);
  data=prepare(clone(DEFAULT)); current=null;
  sessPlan=[]; planDraft=''; agEst=null; agItems=[]; agDraft=''; agTitle=''; agOpen=false; agMat=null; agDayISO=null; pendingTask=null; taskGoal=null; debrief=null; armed=null; goalMin=null; pomoCount=null; sessMode='libre'; pomoMin=25;   // rien du compte précédent dans le lanceur
  try{ localStorage.removeItem(LASTSESS_KEY); }catch(e){}
  render();
  try{ localStorage.removeItem(ARENA_SEEN_KEY); }catch(e){}   // après render() : sinon il réécrit {0,0} et la reconnexion rejouerait toutes les révélations
  showAuthGate('login');
}

// -- Synchro des données : save() appelle scheduleSync(), qui débounce le push réseau. --
function scheduleSync(){
  if(authState==='anon' || !supaConfigured()) return;
  if(!syncPending){ const m=loadSyncMeta(); if(!m.dirty){ m.dirty=true; saveSyncMeta(m); } }
  syncPending=true; clearTimeout(syncTimer); syncTimer=setTimeout(flushSync, SYNC_DEBOUNCE_MS);
}
// Ce qu'on vient de tirer du cloud devient la référence : rien à renvoyer.
function markSynced(){ syncedJSON=JSON.stringify(data); syncPending=false; clearTimeout(syncTimer); }
function flushSync(){ clearTimeout(syncTimer); if(syncPending) pushToCloud(); }
async function pushToCloud(){
  if(!authSession) return;
  syncPending=false; pushing++;
  const now=new Date().toISOString();
  try{
    const snap=JSON.stringify(data); syncedJSON=snap;   // optimiste : un save() identique pendant l'envoi ne relance rien
    const body='[{"user_id":'+JSON.stringify(authSession.user.id)+',"data":'+snap+',"updated_at":"'+now+'"}]';
    const r=await fetch(SUPA_REST+'/rest/v1/user_data', {method:'POST', keepalive: body.length<60000,   // keepalive : survit à l'appli mise en arrière-plan
      headers:Object.assign({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}, authHeaders()),
      body});
    if(r.ok){ authState='online'; const m=loadSyncMeta(); m.lastLocalChangeAt=now; m.dirty=syncPending; saveSyncMeta(m); }
    else if(r.status===401){ authState='offline'; syncPending=true; syncedJSON=null; refreshSession(); }
    else { authState='offline'; syncPending=true; syncedJSON=null; }
  }catch(e){ authState='offline'; syncPending=true; syncedJSON=null; }
  finally{ pushing--; }
}
async function pullFromCloud(){
  const r=await fetch(SUPA_REST+'/rest/v1/user_data?user_id=eq.'+encodeURIComponent(authSession.user.id)+'&select=data,updated_at', {headers:authHeaders()});
  if(!r.ok) throw new Error('pull failed');
  const j=await r.json();
  return (j && j[0]) ? j[0] : null;
}
// Réconciliation au login (une fois par appareil/session) : voir CLAUDE.md pour la règle "dernier écrit gagne".
// Mesure grossière de la "richesse" d'un jeu de données, pour repérer un remplacement qui ferait perdre du contenu.
function richness(d){ return (d.matieres||[]).length
  + (d.matieres||[]).reduce((s,m)=>s+(m.chapitres||[]).length,0)
  + (d.sessions||[]).length + (d.todos||[]).length + (d.debriefs||[]).length; }
async function reconcileOnLogin(){
  if(!supaConfigured() || !authSession) return;
  try{
    localStorage.setItem('suivi-revisions-bac-preauth-backup', localStorage.getItem(STORE_KEY)||'');
    const cloud=await pullFromCloud();
    const meta=loadSyncMeta();
    const hasLocalContent = (data.matieres&&data.matieres.length) || (data.sessions&&data.sessions.length) || (data.todos&&data.todos.length);
    if(!cloud){
      if(hasLocalContent && !meta.migrated){
        const ok=await uiConfirm("On a trouvé des données sur cet appareil. Les envoyer vers ton compte ?", {title:'Données locales', ok:'Envoyer'});
        if(ok) await pushToCloud();
      }
      meta.migrated=true; saveSyncMeta(meta);
    } else if((!meta.lastLocalChangeAt || newerThan(cloud.updated_at, meta.lastLocalChangeAt)) && !data.active){
      // !data.active : on ne remplace jamais les données pendant une session en cours sur CET appareil
      // (sinon le focus plein écran se ferme et la session en cours disparaît sans être enregistrée).
      const incoming = cloud.data && Object.keys(cloud.data).length ? cloud.data : clone(DEFAULT);
      // Garde-fou : si cet appareil a des données qui ont l'air plus riches que ce qui va les remplacer
      // (nouvel appareil jamais synchronisé, ou incohérence quelconque), on demande avant d'écraser
      // plutôt que de remplacer en silence (voir CLAUDE.md, incident du 05/09).
      if(hasLocalContent && richness(data) > richness(incoming)){
        const ok=await uiConfirm(
          `Les données de cet appareil semblent plus complètes que celles de ton compte (${richness(data)} éléments ici, ${richness(incoming)} dans le compte). Remplacer quand même par la version du compte ?`,
          {title:'Données différentes', ok:'Remplacer', danger:true});
        if(!ok){ authState='online'; return; }   // on garde les données de cet appareil ; reconcileOnLogin() redemandera au prochain boot
      }
      data = backfillDaily(prepare(incoming));
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}   // écrit direct : évite de re-pousser ce qu'on vient de tirer
      markSynced();
      current=null;   // la vue détail pouvait pointer sur un index qui n'existe plus dans la copie cloud
      meta.migrated=true; meta.lastLocalChangeAt=cloud.updated_at; meta.dirty=false; saveSyncMeta(meta);
      render();
    } else if(!data.active){
      meta.migrated=true; saveSyncMeta(meta);
    }
    // data.active vrai : on ne touche à rien, `meta.migrated` reste tel quel → reconcileOnLogin() réessaiera au prochain boot/login.
    authState='online';
  }catch(e){ authState='offline'; }
}

// Synchro entre appareils (téléphone ↔ ordi) : sans ceci, un appareil ne relisait le cloud qu'à
// l'ouverture de la page — une session lancée sur le tel n'apparaissait jamais sur l'ordi resté ouvert.
// On relit donc le cloud au retour sur la page et toutes les 20 s tant qu'elle est visible, en silence
// (le garde-fou « données plus riches » reste réservé à reconcileOnLogin(), au démarrage).
const PULL_EVERY_MS = 20000;
let pulling = false, pushing = 0, lastTypeAt = 0;
document.addEventListener('input', ()=>{ lastTypeAt=Date.now(); }, true);
// Texte stable d'un objet (clés triées) : la base renvoie les clés dans un autre ordre que le nôtre.
function canon(o){ return JSON.stringify(o, (k,v)=> v && typeof v==='object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}) : v); }
function uiBusy(){   // ne jamais redessiner sous les doigts : saisie en cours, modale, page « Qu'est-ce que tu vas faire ? »…
  const el=document.activeElement, open=id=>{ const n=document.getElementById(id); return n && !n.classList.contains('hidden'); };
  // un champ vide resté sélectionné (ou caché sous le plein écran lecture seule) ne bloque pas la mise à jour
  const typing = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !(focusShown && !ownSession)
    && (el.type==='range' || (el.value||'')!=='' || Date.now()-lastTypeAt<15000);
  return typing || open('modal') || open('planScreen') || open('cpick') || open('breathe') || open('authgate') || open('arenes') || !!document.querySelector('.arwarp,.arintro,.arspot,.argauge');
}
async function pullIfNewer(){
  if(!supaConfigured() || !authSession || pulling || document.hidden) return;
  if(syncPending){ flushSync(); return; }   // nos changements d'abord, on relira au prochain coup
  if(pushing) return;
  if(!loadSyncMeta().migrated || uiBusy()) return;
  pulling=true;
  try{
    const cloud=await pullFromCloud(), meta=loadSyncMeta();
    // On compare le CONTENU, pas les heures : l'horloge du tel et celle de l'ordi peuvent être décalées.
    // Rien en attente d'envoi ici (ni en cours d'envoi) → le cloud est la vérité.
    if(!cloud || syncPending || pushing || uiBusy()) return;
    const incoming=backfillDaily(prepare(cloud.data && Object.keys(cloud.data).length ? cloud.data : clone(DEFAULT)));
    if(data.active && ownSession) incoming.active=data.active;   // la session est pilotée ICI : sa version fait foi
    if(canon(incoming)===canon(data)) return;
    const curId = current!=null && data.matieres[current] ? data.matieres[current].id : null;
    data=incoming;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}   // écrit direct : pas de re-push de ce qu'on vient de tirer
    markSynced(); meta.lastLocalChangeAt=cloud.updated_at; meta.dirty=false; saveSyncMeta(meta);
    const ci = curId ? data.matieres.findIndex(m=>m.id===curId) : -1; current = ci>=0 ? ci : null;
    if(data.active && !focusShown) ownSession=false;   // session lancée sur un autre appareil : affichée ici en lecture seule
    authState='online'; render(); refreshFocus();
  }catch(e){ authState='offline'; }
  finally{ pulling=false; }
}
// Dates comparées en vrai temps : Supabase renvoie « …+00:00 », nous « …Z » — comparer les textes peut se tromper.
function newerThan(a,b){ return Date.parse(a) > Date.parse(b); }
// Toutes les 20 s, et toutes les 5 s quand on regarde ici une session lancée sur un autre appareil (on attend qu'elle s'arrête).
let lastPullAt=0;
setInterval(()=>{ const every = data.active && !ownSession ? 5000 : PULL_EVERY_MS;
  if(Date.now()-lastPullAt >= every){ lastPullAt=Date.now(); pullIfNewer(); } }, 5000);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSync(); else pullIfNewer(); });
window.addEventListener('pagehide', flushSync);   // on quitte l'appli (tel verrouillé…) : on envoie tout de suite, sans attendre les 3 s
window.addEventListener('focus', pullIfNewer);

// -- Écran de connexion (page pleine, pas une modale transitoire — pas d'annulation possible) --
function showAuthGate(mode){ document.getElementById('authgate').classList.remove('hidden'); renderAuthGate(mode||'login'); }
function hideAuthGate(){ document.getElementById('authgate').classList.add('hidden'); }

    ${authErr?`<p class="autherr">${escapeH(authErr)}</p>`:''}
    <button class="authcta" id="agSubmit" onclick="submitAuth('${isLogin?'login':'signup'}')">${isLogin?'Se connecter':'Créer mon compte'}</button>

function renderAuthReset(){

async function submitAuth(kind){
  const email=((document.getElementById('agEmail')||{}).value||'').trim();
  const pw=(document.getElementById('agPw')||{}).value||'';
  authErr='';
  if(!email || !pw){ authErr='Renseigne un email et un mot de passe.'; renderAuthGate(kind); return; }
  if(kind==='signup'){
    if(pw.length<6){ authErr='6 caractères minimum pour le mot de passe.'; renderAuthGate(kind); return; }
    const pw2=(document.getElementById('agPw2')||{}).value||'';
    if(pw!==pw2){ authErr='Les deux mots de passe ne correspondent pas.'; renderAuthGate(kind); return; }
  }
  const btn=document.getElementById('agSubmit'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  try{
    if(kind==='signup'){
      const res=await signup(email,pw);
      if(res==='pending'){ renderAuthPending(email); return; }
    } else {
      await login(email,pw);
    }
    hideAuthGate();
    await reconcileOnLogin();
    render();
  }catch(e){
    authErr = translateAuthErr(e.message || 'Une erreur est survenue.');
    renderAuthGate(kind);
  }
}

function couleur(p){ if(p<=20)return getCSS('--rouge'); if(p<=40)return getCSS('--orange'); if(p<=60)return getCSS('--jaune'); return getCSS('--vert'); }
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function moyenne(ch){ return ch.length?Math.round(ch.reduce((s,c)=>s+(+c.pct||0),0)/ch.length):0; }
function fmtDate(iso){ return iso?new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}):''; }
function escapeH(s){ return (s+'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// Maîtrise globale sur TOUS les chapitres de toutes les matières (ou null si aucun chapitre).
function globalMoyenne(){
  const all = data.matieres.flatMap(m=>m.chapitres);
  return all.length ? moyenne(all) : null;
}
// Temps de travail cumulé aujourd'hui (sessions dont le début est aujourd'hui).
function todayWorkMs(){
  const d=new Date(); d.setHours(0,0,0,0); const start=d.getTime(), end=addDays(start,1);
  return (data.sessions||[]).reduce((s,x)=>{ const t=Date.parse(x.start);
    return (x.end && t>=start && t<end) ? s+Math.max(0,Date.parse(x.end)-t) : s; },0);
}

// ---------- Page Accueil (tableau de bord) ----------
// Jour local (minuit) en ms — sert aux comparaisons « aujourd'hui ».
function localDay(ms){ const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
// Avance de n jours de calendrier (jamais « + n × 24 h » : le jour du changement d'heure dure 23 ou 25 h,
// et minuit + 24 h retombait sur le même jour — vu le 25/10, dimanche affiché deux fois dans l'agenda).
function addDays(ms,n){ const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); }
// Ensemble des jours (minuit local) ayant au moins une session terminée.
function sessionDaySet(){ const s=new Set(); (data.sessions||[]).forEach(x=>{ if(x.end) s.add(localDay(Date.parse(x.start))); }); return s; }
// Série : jours consécutifs avec ≥1 session, terminant aujourd'hui (ou hier, pour ne pas
// casser la série en début de journée avant la 1re session).
function streakDays(){
  const set=sessionDaySet(); if(!set.size) return 0;
  const today=localDay(Date.now()), yest=addDays(today,-1);
  let cur = set.has(today) ? today : (set.has(yest) ? yest : null);
  if(cur===null) return 0;
  let n=0; while(set.has(cur)){ n++; cur=addDays(cur,-1); }
  return n;
}
// « À bosser » : chapitres les plus faibles (≤40) + matières délaissées (aucune session depuis 4 j).
function aBosser(){
  const out=[], DAY=86400000, today=localDay(Date.now());
  const weak=[];
  data.matieres.forEach((m,mi)=>m.chapitres.forEach(c=>{ if((+c.pct||0)<=40) weak.push({mi,m,c}); }));
  weak.sort((a,b)=>(+a.c.pct||0)-(+b.c.pct||0));
  weak.slice(0,3).forEach(w=>out.push({mi:w.mi, color:w.m.color, txt:w.c.nom, sub:'Maîtrise faible', pct:+w.c.pct||0}));
  // matières avec chapitres mais pas travaillées depuis 4 j (et pas déjà listées via un chap faible)
  const lastByMat={}; (data.sessions||[]).forEach(x=>{ if(x.end){ const d=localDay(Date.parse(x.start)); if(!lastByMat[x.mat]||d>lastByMat[x.mat]) lastByMat[x.mat]=d; } });
  const shown=new Set(out.map(o=>o.mi));
  data.matieres.forEach((m,mi)=>{ if(!m.chapitres.length||shown.has(mi)) return;
    const last=lastByMat[m.id]; const days=last?Math.round((today-last)/DAY):999;
    if(days>=4) out.push({mi, color:m.color, txt:m.nom, sub:last?`Pas révisée depuis ${days} jour${days>1?'s':''}`:'Jamais travaillée', pct:moyenne(m.chapitres)});
  });
  return out.slice(0,4);
}
// « À réévaluer » : simple rappel périodique tous les REEVAL_DAYS jours (« pense à repasser
// réévaluer tes chapitres »), pas un suivi par chapitre — demandé volontairement simple par Eric,
// une logique par chapitre (touché/pas touché) a été essayée puis jugée trop compliquée.
const REEVAL_DAYS = 4;
const REEVAL_KEY = "suivi-revisions-bac-lastreeval";
// localStorage protégé par try/catch (comme load()/loadSyncMeta()) : appelée à CHAQUE render(),
// pas juste au boot — une exception non catchée ici (quota/navigation privée) ferait planter
// render() avant d'atteindre save() et bloquerait toute sauvegarde ultérieure.
function reevalDue(){
  try{
    if(!data.matieres.some(m=>m.chapitres.length)) return false;   // rien à réévaluer sans chapitre
    const anchor=localStorage.getItem(REEVAL_KEY);
    if(!anchor){ localStorage.setItem(REEVAL_KEY, dateKey(Date.now())); return false; }   // amorce le 1er cycle
    const days=Math.round((localDay(Date.now())-localDay(new Date(anchor+'T00:00:00').getTime()))/86400000);
    return days>=REEVAL_DAYS;
  }catch(e){ return false; }
}
// Le cycle ne repart que quand l'utilisateur clique effectivement sur le rappel (goReeval) —
// pas automatiquement à chaque affichage, sinon la pastille/bannière disparaîtrait après le
// premier rendu de la journée au lieu de rester visible tant qu'on n'a pas agi.
function ackReeval(){ try{ localStorage.setItem(REEVAL_KEY, dateKey(Date.now())); }catch(e){} }
// Depuis l'Accueil, le rappel envoie simplement vers l'onglet Matières (pas de chapitre précis
// visé, ce n'est plus un suivi par chapitre).
function goReeval(){ ackReeval(); page='matieres'; render(); window.scrollTo({top:0}); }
// Notif navigateur (bonus, desktop uniquement — Safari iOS ne supporte l'API Notification que
// dans une PWA installée avec Push, pas dans un onglet classique : `'Notification' in window`
// est simplement false là-bas, donc no-op silencieux, rien ne casse). Une seule fois par jour.
const REEVAL_NOTIF_KEY = "suivi-revisions-bac-reevalnotif";
function maybeNotifyReeval(){
  if(!('Notification' in window)) return;
  if(!reevalDue()) return;
  const today=dateKey(Date.now());
  try{ if(localStorage.getItem(REEVAL_NOTIF_KEY)===today) return; }catch(e){}
  const fire=()=>{
    try{ new Notification('Mes révisions', {body:'Pense à repasser réévaluer tes chapitres.'}); }catch(e){}
    try{ localStorage.setItem(REEVAL_NOTIF_KEY, today); }catch(e){}
  };
  if(Notification.permission==='granted') fire();
  else if(Notification.permission!=='denied'){
    Notification.requestPermission().then(p=>{ if(p==='granted') fire(); else{ try{ localStorage.setItem(REEVAL_NOTIF_KEY, today); }catch(e){} } });
  }
}
// Recap du jour (compilé automatiquement) : temps, répartition, chapitres modifiés, tâches faites.
function recapToday(){
  const today=localDay(Date.now());
  const work=todayWorkMs();
  const perMat={};
  (data.sessions||[]).forEach(x=>{ if(x.end && localDay(Date.parse(x.start))===today){ perMat[x.mat]=(perMat[x.mat]||0)+Math.max(0,Date.parse(x.end)-Date.parse(x.start)); } });
  const changed=[];
  data.matieres.forEach(m=>m.chapitres.forEach(c=>{ const h=c.hist||[]; if(h.length<2) return;
    const last=h[h.length-1], prev=h[h.length-2];
    if(localDay(Date.parse(last.t))===today && last.p!==prev.p) changed.push({nom:c.nom, from:prev.p, to:last.p, color:m.color});
  }));
  const done=(data.todos||[]).filter(t=>t.done && t.doneAt && localDay(Date.parse(t.doneAt))===today);
  const debs=(data.debriefs||[]).filter(d=>localDay(Date.parse(d.start))===today);
  return {work, perMat, changed, done, debs};
}

// ---------- Agenda (onglet Session) ----------
// Une tâche est datée et rattachée à une matière ; la taper pré-arme cette matière pour lancer la session.
// Fenêtre glissante de 7 jours : 0 = aujourd'hui + les 6 suivants, +1 = les 7 jours d'après…
// ‹ reste cliquable en dessous de 0 (12/09 : Eric veut pouvoir revoir les jours passés et leurs tâches
// barrées) — seule la PLANIFICATION reste interdite dans le passé (setAgDay/addTask le bloquent toujours).
let agendaOffset=0;
let agMat=null;       // matière sélectionnée pour la nouvelle tâche
let agDayISO=null;    // jour (YYYY-MM-DD) sélectionné pour la nouvelle tâche
let agEst=null;       // durée estimée (minutes) de la nouvelle tâche — facultative
let agOpen=false;     // panneau « Nouvelle tâche » ouvert
let agItems=[], agDraft='', agTitle='';   // ce qu'il y a à faire : 1 élément = tâche simple, plusieurs = étapes (toutes au même niveau)
const EST_OPTS=[10,20,30,45,60];   // durées estimées proposées (minutes) ; « Autre » pour le reste

const DOW_LET=['L','M','M','J','V','S','D'];
const MONTHS_AB=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function dateKey(ms){ const d=new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayKey(){ return dateKey(Date.now()); }
// Début (00:00 local) de la fenêtre de 7 jours décalée de `offset` blocs de 7 jours à partir d'aujourd'hui.
function windowStart(offset){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offset*7); return d.getTime(); }
function windowDays(offset){ const start=windowStart(offset),out=[]; for(let i=0;i<7;i++){ const ms=addDays(start,i),d=new Date(ms); out.push({ms, iso:dateKey(ms), let:DOW_LET[(d.getDay()+6)%7], num:d.getDate(), mon:MONTHS_AB[d.getMonth()]}); } return out; }
// ⚠️ nommé agWindowLabel (pas windowLabel) : un `windowLabel()` sans argument existe déjà plus bas pour le libellé
// de période des Stats (Screen Time) — un même nom de fonction déclarée deux fois au top-level se serait écrasé.
function agWindowLabel(offset){ const d=windowDays(offset); if(offset===0) return `Aujourd'hui – ${d[6].num} ${d[6].mon}`; return `${d[0].num} ${d[0].mon} – ${d[6].num} ${d[6].mon}`; }
function isPast(iso){ return iso < todayKey(); }   // jour révolu (comparaison de chaînes YYYY-MM-DD = ok)
function shiftAgenda(n){ agendaOffset+=n; agDayISO=null; refreshTemps(); }
function setAgMat(id){ agMat=(agMat===id?null:id); refreshTemps(); }
function setAgDay(iso){ if(isPast(iso)) return; agDayISO=iso; refreshTemps(); }   // pas de planif dans le passé

function openAgNew(){ agOpen=true; refreshTemps(); const i=document.getElementById('agInput'); if(i) i.focus(); }
function closeAgNew(){ agOpen=false; agItems=[]; agDraft=''; agTitle=''; agEst=null; refreshTemps(); }
function agAll(){ return agItems.concat(agDraft.trim()?[agDraft.trim().slice(0,120)]:[]); }   // une étape tapée mais pas encore ajoutée compte
function agSync(){   // pendant la saisie : met à jour le bouton sans tout redessiner (garde le clavier ouvert)
  const b=document.getElementById('agSave'); if(!b) return; if(agMat&&!matById(agMat)) agMat=null; const ok=agMat&&agAll().length&&agDayISO;
  b.disabled=!ok; b.querySelector('span').textContent=!agMat?'Choisis une matière':!agAll().length?'Écris ce que tu dois faire':'Ajouter la tâche';
}
function addAgItem(){
  const v=agDraft.trim(); if(!v) return;
  agItems.push(v.slice(0,120)); agDraft=''; refreshTemps();
  const i=document.getElementById('agInput'); if(i) i.focus();
}
function delAgItem(k){ agItems.splice(k,1); refreshTemps(); }
function addTask(){
  const items=agAll(); if(!items.length || !agMat || !matById(agMat)) return;   // une matière est obligatoire
  if(!agDayISO || isPast(agDayISO)) return;   // sécurité : jamais sur un jour passé
  const title=agTitle.trim().slice(0,120);
  const t={id:'t'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36), txt:items.length>1?(title||items.join(', ')):items[0], mat:agMat, date:agDayISO, done:false, doneAt:null, created:new Date().toISOString()};
  if(items.length>1){ t.steps=items.map(txt=>({txt, done:false})); if(title) t.named=true; }
  if(agEst) t.est=agEst;
  data.todos.push(t);
  agOpen=false; agItems=[]; agDraft=''; agTitle=''; agEst=null;
  save(); refreshTemps();
}
function setAgEst(m){ agEst=(agEst===m?null:m); refreshTemps(); }
// « 45 », « 45 min », « 1h30 », « 1 h 30 », « 2h », « 1,5 h » → minutes (0 si incompris)
function parseMinutes(v){
  const t=String(v||'').toLowerCase().replace(',', '.').trim(); let m;
  if((m=t.match(/^(\d+(?:\.\d+)?)\s*h(?:eures?)?\s*(\d+)?\s*(?:min)?$/))) return Math.round(+m[1]*60+(+m[2]||0));
  if((m=t.match(/^(\d+)\s*(?:min|mn|m)?$/))) return +m[1];
  return 0;
}
async function agEstCustom(){
  const v=await uiPrompt(agEst&&!EST_OPTS.includes(agEst)?String(agEst):'',{title:'Temps estimé',message:'Combien de temps environ ? (ex. 45 ou 1h30)'});
  const n=parseMinutes(v); if(n>0) agEst=Math.min(n, MAX_SESSION_H*60); else if(v&&v.trim()) setTimeout(()=>uiConfirm('Écris une durée comme « 45 », « 1h30 » ou « 2 h ».',{title:'Durée non comprise',ok:'OK'}),50); refreshTemps();
}
// Cocher une étape d'une tâche : toutes faites = la tâche est faite (et inversement).
function toggleStep(id,k){
  const t=(data.todos||[]).find(x=>x.id===id); if(!t||!t.steps||!t.steps[k]) return;
  t.steps[k].done=!t.steps[k].done;
  const all=t.steps.every(x=>x.done); if(all!==t.done){ t.done=all; t.doneAt=all?new Date().toISOString():null; }
  save(); refreshTodos();
}
function toggleTodo(id){ const t=(data.todos||[]).find(x=>x.id===id); if(!t) return; t.done=!t.done; t.doneAt=t.done?new Date().toISOString():null;
  if(t.steps){ if(t.done) t.steps.forEach(x=>x.done=true); else if(t.steps.every(x=>x.done)) t.steps.forEach(x=>x.done=false); }   // cocher la tâche = toutes ses étapes
  save(); refreshTodos(); }
function delTodo(id){ const k=(data.todos||[]).findIndex(x=>x.id===id); if(k<0) return; const [t]=data.todos.splice(k,1); if(pendingTask===id) pendingTask=null; save(); refreshTodos();
  showUndo('Tâche « '+t.txt+' » supprimée', ()=>{ data.todos.splice(Math.min(k,data.todos.length),0,t); save(); refreshTodos(); }); }   // le temps estimé reste l'objectif affiché
// Reporter une tâche en retard : ouvre un choix du jour (auj., demain, 2 semaines à venir).
function reschedulePick(id){
  const t=(data.todos||[]).find(x=>x.id===id); if(!t) return;
  const base=new Date(); base.setHours(0,0,0,0);
  let chips='';
  for(let i=0;i<14;i++){ const ms=addDays(base.getTime(),i), d=new Date(ms), iso=dateKey(ms);
    const lbl = i===0?'Auj.' : i===1?'Dem.' : DOW_LET[(d.getDay()+6)%7];
    chips+=`<button class="rbchip${iso===t.date?' on':''}" onclick="doReschedule('${id}','${iso}')"><span>${lbl}</span><b>${d.getDate()}</b></button>`;
  }
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="panel" role="dialog" aria-modal="true">
    <div class="phead"><span>Reporter à…</span>
      <button class="iconbtn" aria-label="Fermer" onclick="closeModal(null)">${ic('x')}</button></div>
    <p class="mdmsg">${escapeH(t.txt)}</p>
    <div class="rbgrid">${chips}</div></div>`;
  modalResolve=null; m.classList.remove('hidden');
}
function doReschedule(id,iso){
  const t=(data.todos||[]).find(x=>x.id===id); if(!t) return;
  t.date=iso; t.done=false; t.doneAt=null; save();
  const m=document.getElementById('modal'); m.classList.add('hidden'); m.innerHTML='';
  refreshTodos();
}
// Bosser une matière depuis l'Accueil (À bosser) : pré-arme la matière et bascule sur l'onglet Travail.
function workSubject(mi){ const m=data.matieres[mi]; if(!m) return; if(!data.active) armed=m.id; goPage('session'); }
// Taper une tâche dans l'agenda (onglet Session) : pré-arme sa matière (arme + redessine tout de suite —
// aucun scroll ici, voir handleTaskClick ci-dessous pour la raison).
function armFromTask(id){ const t=(data.todos||[]).find(x=>x.id===id); if(!t||data.active) return; prepTask(t);
  // le lanceur au-dessus change de hauteur (tâche, durée) : on garde la tâche pile sous le doigt/la souris, sinon le 2e clic du double-clic la rate
  const q=`#temps [data-tid="${id}"]`, y0=(document.querySelector(q)||{getBoundingClientRect:()=>null}).getBoundingClientRect();
  renderTemps();
  const el=document.querySelector(q); if(y0&&el) window.scrollBy(0, el.getBoundingClientRect().top-y0.top); }
// Pré-remplit le lanceur avec une tâche : matière, temps estimé (objectif de la session) et étapes restantes (liste « Qu'est-ce que tu vas faire ? »).
let pendingTask=null;   // id de la tâche de l'agenda liée à la prochaine session
let taskGoal=null;      // temps estimé de cette tâche (minutes) = objectif proposé ; null = objectif choisi à la main
function prepTask(t){
  if(!t.mat || !matById(t.mat) || t.done) return;
  armed=t.mat; pendingTask=t.id; taskGoal=t.est ? Math.max(5, t.est-(t.spent||0)) : null;   // temps déjà passé dessus déduit
  const left=(t.steps||[]).filter(x=>!x.done).map(x=>x.txt);
  sessPlan = left.length ? left : [t.txt]; planDraft='';
}
function forgetTask(){ pendingTask=null; taskGoal=null; }
// Détection manuelle du double-clic sur une tâche (pas le `dblclick` natif du navigateur), pour deux raisons :
// 1) armFromTask() redessine l'agenda à chaque clic, remplaçant le nœud DOM sous le curseur — certains
//    navigateurs (Safari en tête) n'émettent alors jamais `dblclick`, son suivi natif étant lié à ce nœud précis.
// 2) même en comparant id+horodatage entre deux clics, un `window.scrollTo` déclenché DÈS le 1er clic ferait
//    dériver la page sous le curseur immobile avant que le 2e clic n'arrive (repéré en pratique : le double-clic
//    marchait sur les tâches déjà tout en haut — bloc « En retard », peu/pas affectées par le scroll vers le
//    haut — mais jamais plus bas dans la liste, où le scroll les fait justement sortir de sous le curseur).
//    Le scroll est donc différé : s'il n'y a pas de 2e clic dans la fenêtre, on scrolle ; sinon on l'annule.
let lastTaskClick={id:null, t:0};
let taskScrollTimer=null;
function handleTaskClick(id){
  const now=Date.now();
  if(lastTaskClick.id===id && (now-lastTaskClick.t)<350){
    lastTaskClick={id:null, t:0};
    if(taskScrollTimer){ clearTimeout(taskScrollTimer); taskScrollTimer=null; }
    renameTask(id);
    return;
  }
  lastTaskClick={id, t:now};
  armFromTask(id);
  if(taskScrollTimer) clearTimeout(taskScrollTimer);
  taskScrollTimer=setTimeout(()=>{ taskScrollTimer=null; window.scrollTo({top:0,behavior:'smooth'}); }, 350);
}
// Taper une tâche depuis l'Accueil : pré-arme sa matière et bascule sur l'onglet Session.
function goWorkTask(id){ const t=(data.todos||[]).find(x=>x.id===id); if(!t) return; if(!data.active) prepTask(t); goPage('session'); }
// Re-rend la page concernée (en préservant le champ d'ajout sur Session).
function refreshTemps(){ renderTemps(); agSync(); }   // la saisie du panneau « Nouvelle tâche » est gardée dans agDraft/agTitle
// Petites infos d'une tâche : durée estimée + étapes faites.
function taskMeta(t){ const n=(t.steps||[]).length, d=(t.steps||[]).filter(x=>x.done).length;
  return (t.est?`<span class="agest">${fmtDur(t.est*60000)}</span>`:'')+(n?`<span class="agest">${d}/${n}</span>`:''); }
function refreshTodos(){ if(page==='session') refreshTemps(); else render(); }

// Ligne de tâche réutilisable. Double-clic sur le texte → renommer. Le bouton « reprogrammer » est toujours visible
// (pas seulement sur les tâches en retard) pour pouvoir changer la date d'une tâche déjà planifiée.
function taskRow(t, late){
  const m=matById(t.mat), col=m?m.color:'var(--muted)', meta=taskMeta(t), steps=t.steps&&t.steps.length?t.steps:null;
  const play=(m&&!t.done&&!data.active)?`<span class="agplay">${ic('play',13)}</span>`:'';
  const side=`<button class="agreb" onclick="reschedulePick('${t.id}')" title="Changer le jour" aria-label="Changer le jour">${ic('reset',15)}</button>
    <button class="iconbtn tododel" onclick="delTodo('${t.id}')" title="Supprimer" aria-label="Supprimer la tâche">${ic('x',16)}</button>`;
  const chk=`<button class="todochk ${t.done?'on':''}" onclick="toggleTodo('${t.id}')" aria-label="Cocher">${ic('check',14)}</button>`;
  if(!steps) return `<div class="agtask${late?' late':''}">${chk}
    <button class="agtxt ${t.done?'done':''}"${m?` style="--mc:${m.color}"`:''} onclick="handleTaskClick('${t.id}')" data-tid="${t.id}" title="Double-clic pour renommer">
      <span class="cdot" style="background:${col}"></span><span class="agmain"><span class="agname">${escapeH(t.txt)}</span>${meta?`<span class="agmeta">${meta}</span>`:''}</span>${play}
    </button>${side}</div>`;
  // plusieurs étapes : en-tête (nom donné, sinon la matière) + toutes les étapes au même niveau, dans la même carte
  return `<div class="agtask${late?' late':''}">${chk}
    <div class="agbox${t.done?' done':''}"${m?` style="--mc:${m.color}"`:''}>
      <button class="agtxt aghd" onclick="handleTaskClick('${t.id}')" data-tid="${t.id}" title="Double-clic pour renommer">
        <span class="cdot" style="background:${col}"></span><span class="agmain"><span class="agname${t.named?'':' agmat'}">${escapeH(t.named?t.txt:(m?m.nom:'Tâche'))}</span>${meta?`<span class="agmeta">${meta}</span>`:''}</span>${play}
      </button>
      ${steps.map((x,k)=>`<button class="agstep${x.done?' done':''}" onclick="toggleStep('${t.id}',${k})" aria-label="Cocher l'étape ${escapeH(x.txt)}">
        <span class="todochk ${x.done?'on':''}">${ic('check',12)}</span><span>${escapeH(x.txt)}</span></button>`).join('')}
    </div>${side}</div>`;
}
async function renameTask(id){
  const t=(data.todos||[]).find(x=>x.id===id); if(!t) return;
  const n=await uiPrompt(t.txt,{title:'Renommer la tâche'});

}

// ---------- Compte à rebours des épreuves ----------
// Nombre de jours (LOCAUX) entre aujourd'hui et une date 'YYYY-MM-DD'. 0 = aujourd'hui, négatif = passé.
function daysUntil(iso){
  const p=(iso||'').split('-'); if(p.length!==3) return null;
  const ex=new Date(+p[0], +p[1]-1, +p[2]); ex.setHours(0,0,0,0);
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((ex-now)/86400000);
}
function fmtExamDate(iso){ const p=(iso||'').split('-'); if(p.length!==3) return '';
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'}); }
// Libellé « J-12 / Auj. / Demain / Passée » à partir du nombre de jours.
function cdLabel(dd){ return dd===0?'Auj.' : dd===1?'Demain' : dd<0?'Passée' : 'J-'+dd; }
function cdPhrase(dd){ return dd===0?"C'est aujourd'hui !" : dd===1?"C'est demain" : dd<0?`il y a ${-dd} jour${-dd>1?'s':''}` : `dans ${dd} jours`; }
// Bandeau accueil : épreuves À VENIR (aujourd'hui inclus), triées par proximité. La plus proche en avant.
function countdownBanner(){
  const ups=(data.matieres||[]).filter(m=>m.exam).map(m=>({m,dd:daysUntil(m.exam)}))
    .filter(x=>x.dd!==null && x.dd>=0).sort((a,b)=>a.dd-b.dd);
  if(!ups.length) return '';
  const {m,dd}=ups[0];
  const cls = dd===0?'today' : dd<=7?'soon' : '';
  const rest = ups.slice(1,5).map(x=>`<span class="cdchip"><span class="cddot" style="background:${x.m.color}"></span>${escapeH(x.m.nom)} <span class="cdj">${cdLabel(x.dd)}</span></span>`).join('');
  return `<div class="countdown">
    <div class="cdmain">
      <span class="cdic">${ic('calendar',22)}</span>
      <span class="cdtxt">
        <span class="cdlbl">Prochaine épreuve</span>
        <span class="cdnm"><span class="cddot" style="background:${m.color}"></span><span class="nmt">${escapeH(m.nom)}</span></span>
        <span class="cdsub">${cdPhrase(dd)} · ${escapeH(fmtExamDate(m.exam))}</span>
      </span>
      <span class="cdjx ${cls}">${dd===0?`<span class="jn">Auj.</span>`:`<span class="jn">${dd}</span><span class="jl">${dd===1?'jour':'jours'}</span>`}</span>
    </div>
    ${rest?`<div class="cdrest">${rest}</div>`:''}
  </div>`;
}

// Anime un nombre de 0 jusqu'à sa valeur (ease-out cubique). Respecte « réduire les animations ».
function prefersReduced(){ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function countUp(el){
  const to=+el.dataset.to||0;
  if(prefersReduced()||to===0){ el.textContent=to; return; }
  const dur=450; let start=null;
  el.textContent='0';
  requestAnimationFrame(function step(ts){
    if(start===null) start=ts;
    const k=Math.min(1,(ts-start)/dur), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(to*e);
    if(k<1) requestAnimationFrame(step);
  });
}

// ---------- Graphes : temps (x) × % de maîtrise (y) ----------
// Domaine de temps commun à tous les graphes d'une matière. Le 1er point se cale à
// GAUCHE (= début du suivi) et la courbe se remplit vers la droite avec le temps.
function chartDomain(list){
  let tmin=Infinity,tmax=-Infinity;
  list.forEach(c=>(c.hist||[]).forEach(pt=>{const t=new Date(pt.t).getTime(); if(t<tmin)tmin=t; if(t>tmax)tmax=t;}));
  const now=Date.now();
  chartReal = isFinite(tmin) ? [tmin,tmax] : [now,now];   // vraie plage avant rembourrage
  if(!isFinite(tmin)){ tmin=now; tmax=now; }
  if(now>tmax) tmax=now;
  if(tmax-tmin<86400000) tmax=tmin+86400000;   // 1 seul jour → rembourrage à DROITE (point à gauche)
  return [tmin,tmax];
}
// Série de la maîtrise MOYENNE de la matière dans le temps (valeur reportée jour par jour).
function avgSeries(list){
  // On trie chaque chapitre UNE seule fois (avant : un re-tri par jour → lent pendant le glissement).
  const chs=list.map(c=>(c.hist||[]).slice().sort((a,b)=>new Date(a.t)-new Date(b.t)));
  const days=[...new Set(chs.flat().map(pt=>pt.t.slice(0,10)))].sort();
  return days.map(day=>{
    let sum=0,n=0;
    chs.forEach(pts=>{
      let v=null;
      for(let i=0;i<pts.length && pts[i].t.slice(0,10)<=day;i++) v=pts[i].p;   // dernier point ≤ ce jour
      if(v!==null){ sum+=v; n++; }
    });
    return {t:day+'T12:00:00.000Z', p:n?Math.round(sum/n):0};
  });
}
// Trace la courbe : fond neutre (pas de bandes colorées), mais la LIGNE change de couleur
// en traversant les paliers de maîtrise (rouge→orange→jaune→vert) pour visualiser la progression.
function lineChart(points, color, o){
  o=o||{};
  const [tmin,tmax]=chartDom, W=o.w, H=o.h, labels=!!o.labels;
  const padL=labels?28:6, padR=8, padT=8, padB=labels?22:6, plotW=W-padL-padR, plotH=H-padT-padB;
  const X=t=>padL+(tmax>tmin?(t-tmin)/(tmax-tmin):0)*plotW;
  const Y=p=>padT+(100-p)/100*plotH;
  let grid='';
  [0,50,100].forEach(p=>{ const y=Y(p).toFixed(1);
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" class="cg"${p===50?' opacity="0.5"':''}/>`;
    if(labels) grid+=`<text x="${padL-5}" y="${(+y+3).toFixed(1)}" class="cyl">${p}</text>`;
  });
  let xl='';
  if(labels){
    const [rmin,rmax]=chartReal;
    if(rmax-rmin < 86400000){            // un seul jour de données → une étiquette calée à gauche
      const today=new Date().toDateString()===new Date(rmax).toDateString();
      const lab=today?"aujourd'hui":fmtDate(new Date(rmax).toISOString());
      xl=`<text x="${padL}" y="${H-7}" class="cxl" style="text-anchor:start">${lab}</text>`;
    } else {                             // plusieurs jours → graduations sans doublon
      const longSpan=(tmax-tmin)/86400000>182 || new Date(tmin).getFullYear()!==new Date(tmax).getFullYear();
      const fmtX=t=>longSpan ? new Date(t).toLocaleDateString('fr-FR',{month:'short',year:'2-digit'}) : fmtDate(new Date(t).toISOString());
      const nT=4; let prev=null;
      for(let i=0;i<=nT;i++){ const t=tmin+(tmax-tmin)*i/nT, lab=fmtX(t);
        if(lab!==prev){ const anc=i===0?'start':i===nT?'end':'middle';
          xl+=`<text x="${X(t).toFixed(1)}" y="${H-7}" class="cxl" style="text-anchor:${anc}">${lab}</text>`; prev=lab; }
      }
    }
  }
  const pts=(points||[]).slice().sort((a,b)=>new Date(a.t)-new Date(b.t));
  let path='';
  if(pts.length){
    const xy=pts.map(pt=>({x:X(new Date(pt.t).getTime()), p:pt.p}));
    const sw=labels?2.6:2.2;
    // la ligne est découpée aux seuils 20/40/60 : chaque morceau prend la couleur de son palier
    let segs='';
    for(let i=0;i+1<xy.length;i++){
      const a=xy[i], b=xy[i+1];
      const cuts=[0,1];
      [20,40,60].forEach(bd=>{ if((a.p-bd)*(b.p-bd)<0) cuts.push((bd-a.p)/(b.p-a.p)); });
      cuts.sort((u,v)=>u-v);
      for(let k=0;k+1<cuts.length;k++){
        const f0=cuts[k], f1=cuts[k+1];
        const p0=a.p+(b.p-a.p)*f0, p1=a.p+(b.p-a.p)*f1;
        const x0=a.x+(b.x-a.x)*f0, x1=a.x+(b.x-a.x)*f1;
        segs+=`<path d="M${x0.toFixed(1)} ${Y(p0).toFixed(1)} L${x1.toFixed(1)} ${Y(p1).toFixed(1)}" fill="none" stroke="${couleur((p0+p1)/2)}" stroke-width="${sw}" stroke-linecap="round"/>`;
      }
    }
    const dots=xy.map((q,i)=>`<circle cx="${q.x.toFixed(1)}" cy="${Y(q.p).toFixed(1)}" r="${labels?3:2.4}" fill="${couleur(q.p)}"><title>${fmtDate(new Date(pts[i].t).toISOString())} · ${pts[i].p} %</title></circle>`).join('');
    const last=xy[xy.length-1];
    const lastDot=`<circle cx="${last.x.toFixed(1)}" cy="${Y(last.p).toFixed(1)}" r="${labels?4:3}" fill="${couleur(last.p)}" stroke="var(--card)" stroke-width="2"/>`;
    path=segs+dots+lastDot;
  }
  return `<svg viewBox="0 0 ${W} ${H}" class="chartsvg">${grid}${xl}${path}</svg>`;
}

function importData(ev){ const f=ev.target.files[0]; if(!f){return;} const r=new FileReader();
  r.onload=async ()=>{ try{
    const parsed=JSON.parse(r.result);
    if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.matieres)) throw new Error('structure');
    if(!await uiConfirm("Remplacer toutes tes données actuelles par ce fichier ? (irréversible)",{title:'Importer',ok:'Remplacer',danger:true})){ ev.target.value=''; return; }
    data=backfillDaily(prepare(parsed)); current=null; render(); alert("Données importées.");
  }catch(e){ alert("Fichier invalide."); } finally { ev.target.value=''; } };
  r.readAsText(f); }

// ================= Brique « Temps de travail » =================
function matById(id){ return data.matieres.find(m=>m.id===id); }
// Ambiances sonores retirées (31/08→01/09) : trop de temps passé à sourcer/valider les fichiers
// audio pour peu d'usage réel. Eric branchera un lien externe (playlist/site tout fait) s'il veut
// du bruit de fond pendant une session — plus rien à maintenir côté app.

// ---------- Méditation (« Respire » avant une session) ----------
// Pas de guide visuel de rythme (cercle qui pulse, Inspire/Expire) : chacun respire à son
// rythme, les yeux fermés — un indicateur à regarder n'a pas de sens dans ce cas.
const READY_PHRASE = "Esprit clair. On s'y met.";
let brTotal=300, brLeft=300, brTick=null, brDoneTick=null, brArmed=null, brCtx=null;
function brClock(s){ const m=Math.floor(s/60), x=s%60; return m+':'+String(x).padStart(2,'0'); }
function breatheHTML(){
  const mins=Math.round(brTotal/60);

  const chain = (brArmed&&matById(brArmed)) ? `<p class="brchain">À la fin, ta session « ${escapeH(matById(brArmed).nom)} » démarre toute seule.</p>` : '';

    <div class="brtime" id="brTime">${brClock(brLeft)}</div>
    <div class="brdurs">${durs}</div>

}
function breatheDoneHTML(){

}
function updateBreathe(){ const el=document.getElementById('brTime'); if(el) el.textContent=brClock(Math.max(0,brLeft)); }
function setBreatheDur(mins){ brTotal=mins*60; brLeft=brTotal; document.querySelectorAll('#breathe .brdur').forEach(b=>b.classList.toggle('on', +b.dataset.m===mins)); updateBreathe(); }
function openBreathe(mins){
  brArmed = (armed && goalReady()) ? armed : null;   // matière + objectif choisis → on enchaîne la session à la fin
  brTotal=(mins||5)*60; brLeft=brTotal;

  const ov=document.getElementById('breathe'); ov.classList.remove('hidden'); ov.innerHTML=breatheHTML();
  if(brTick) clearInterval(brTick);

}
// Chrono à zéro : cloche + phrase, avant de continuer (session enchaînée ou simple sortie).
function finishBreathe(){

  // On donne donc à la session le contexte débloqué à l'ouverture de la méditation, au lieu de le fermer.
  if(brArmed && brCtx && brCtx.state!=='closed'){ closeSessBell(); sessCtx=brCtx; brCtx=null; try{ chime(sessCtx); }catch(e){} }
  else playBell();
  const el=document.getElementById('breathe'); if(el) el.innerHTML=breatheDoneHTML();
  brDoneTick=setTimeout(()=>{ brDoneTick=null; endBreathe(true); },1600);
}
function cancelBreatheDone(){ if(brDoneTick){ clearTimeout(brDoneTick); brDoneTick=null; } endBreathe(false); }
function endBreathe(launch){
  if(brTick){ clearInterval(brTick); brTick=null; }
  if(brDoneTick){ clearTimeout(brDoneTick); brDoneTick=null; }
  // brCtx encore défini = la cloche n'a jamais joué (sortie avant la fin) → on libère le contexte audio primé pour rien.
  // S'il a déjà joué, playBell() se l'est approprié (brCtx=null) et gère sa propre fermeture différée : ne pas y toucher ici.
  if(brCtx){ try{ brCtx.close(); }catch(e){} brCtx=null; }
  document.getElementById('breathe').classList.add('hidden');
  if(launch && brArmed && matById(brArmed)){ armed=brArmed; startSession(); }
  else { if(!data.active) closeSessBell(); render(); }   // contexte passé à une session finalement pas lancée
  brArmed=null;
}
// Débloque l'AudioContext pendant le clic qui ouvre la méditation (politique autoplay des navigateurs/iOS Safari :
// un AudioContext créé plus tard, sans geste utilisateur au même instant, reste "suspended" et ne joue aucun son).
function primeBell(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    brCtx=new Ctx();
    if(brCtx.state==='suspended') brCtx.resume();
  }catch(e){}
}
// Petit carillon synthétisé (Web Audio, aucun fichier) — joué quand le chrono de méditation se termine.
function playBell(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    const ctx=(brCtx && brCtx.state!=='closed') ? brCtx : new Ctx();
    brCtx=null;   // la cloche prend possession du contexte ; endBreathe() ne doit plus le fermer, on s'en charge ici
    chime(ctx);
    setTimeout(()=>ctx.close(),2200);
  }catch(e){}
}
function chime(ctx){
  if(ctx.state==='suspended') ctx.resume();
  const now=ctx.currentTime;
  [[880,0.5,1.8],[880*2.76,0.18,1.1],[880*4.1,0.09,0.7]].forEach(([freq,gain,dec])=>{
    const osc=ctx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
    const g=ctx.createGain(); g.gain.setValueAtTime(gain,now); g.gain.exponentialRampToValueAtTime(0.001,now+dec);
    osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now+dec+0.05);
  });
}
// Cloche des sessions (fin de bloc / de pause / objectif atteint). Contexte audio créé pendant le clic « Travailler »
// et gardé ouvert toute la session (même raison que primeBell) ; repris à chaque toucher de l'écran focus
// (cas d'un rechargement en pleine session, où aucun clic n'a pu le débloquer). Fermé quand la session se termine.
let sessCtx=null;
function primeSessBell(){
  try{
    const Ctx = window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
    if(!sessCtx || sessCtx.state==='closed') sessCtx=new Ctx();
    if(sessCtx.state==='suspended') sessCtx.resume();
  }catch(e){}
}
function sessBell(){ try{ primeSessBell(); if(sessCtx) chime(sessCtx); }catch(e){} }
function closeSessBell(){ if(sessCtx){ try{ sessCtx.close(); }catch(e){} sessCtx=null; } }

// ---- Cycle de vie d'une session (mesurée par horodatage début/fin) ----
function armMat(id){ armed=(armed===id?null:id); if(pendingTask){ forgetTask(); sessPlan=[]; } refreshPicker(); }   // autre matière : la tâche ne suit plus
function setGoal(min){ goalMin=(goalMin===min?null:min); refreshPicker(); }
function clearTaskGoal(){ taskGoal=null; refreshPicker(); }   // « Changer » : on choisit l'objectif à la main (la tâche reste liée)
function setSessMode(mode){ sessMode=mode; refreshPicker(); }
function setPomoMin(min){ pomoMin=min; refreshPicker(); }
function setPomoCount(n){ pomoCount=(pomoCount===n?null:n); refreshPicker(); }
// Objectif « Autre » : heures + minutes libres (même saisie que « Corriger la durée »).
function openGoalCustom(){

function submitGoalCustom(){

  const mn=Math.max(0, parseInt(document.getElementById('goalM').value,10)||0);
  const tot=Math.min(h*60+mn, MAX_SESSION_H*60);   // au-delà du garde-fou « session oubliée », ça n'a pas de sens
  if(tot<5) return;                                  // pas d'objectif minuscule (ni 0) : on laisse la modale ouverte
  const m=document.getElementById('modal'); m.classList.add('hidden'); m.innerHTML='';
  goalMin=tot; refreshPicker();

// Une session a toujours un objectif. Chrono libre : {mat,mode:'libre',start,goal,reached?}. Pomodoro :
// {mat,mode:'pomo',goal,block,phase:'work'|'break'|'ready'|'done',start (= début de la phase),workDone,blocks} —
// chaque bloc de travail terminé est enregistré comme une session normale ; les pauses ne comptent pas.
function startSession(){
  if(data.active || !armed || !matById(armed) || !goalReady()) return;   // jamais par-dessus une session (autre onglet)
  const t=pendingTask&&(data.todos||[]).find(x=>x.id===pendingTask&&x.mat===armed), tg=taskGoal;   // objectif annoncé dans le lanceur, même si la tâche a disparu entre-temps
  const now=new Date().toISOString(), goal=(tg || (sessMode==='pomo' ? pomoCount*pomoMin : goalMin))*60000;
  const block=tg ? Math.min(pomoMin,tg) : pomoMin;   // tâche de 20 min en Pomodoro = 1 bloc de 20
  data.active = sessMode==='pomo'
    ? {mat:armed, mode:'pomo', goal, block, phase:'work', start:now, workDone:0, blocks:0}
    : {mat:armed, mode:'libre', start:now, goal};
  data.active.dev=DEVICE_ID;   // appareil qui pilote la session (voir otherDevice)
  data.active.began=now;   // début réel (en Pomodoro, start = début de la phase en cours)
  data.active.plan=sessPlan.map(txt=>({txt, done:false}));
  if(t){ data.active.task=t.id; if(t.est) data.active.est=t.est; }
  forgetTask();
  saveLastSess();   // la prochaine fois, mode et durée déjà choisis (la matière et la liste restent à choisir)
  armed=null; sessPlan=[]; planDraft=''; ownSession=true;
  primeSessBell();                // pendant le clic : sinon la cloche de fin de bloc resterait muette (autoplay)
  save(); flushSync(); render();  // render() affiche le mode focus plein écran ; flushSync : visible tout de suite sur les autres appareils
}
const POMO_BREAK_MS = 5*60000;
// Bloc en cours, raccourci si besoin pour tomber pile sur l'objectif (2 h en blocs de 25 = 25+25+25+25+20).
function curBlockMs(a){ const b=a.block*60000; return a.goal ? Math.min(b, a.goal-a.workDone) : b; }
// Fait avancer la session selon l'horloge — rattrape d'un coup les phases écoulées (onglet en arrière-plan,
// écran verrouillé, rechargement) : tout est calculé depuis les horodatages, jamais depuis le nombre de ticks.
// Renvoie true si l'état a changé (→ cloche + réaffichage).
function advanceSession(){
  const a=data.active; if(!a) return false;
  const now=Date.now(); let changed=false;
  if(a.mode==='pomo'){
    for(;;){
      const st=Date.parse(a.start);
      if(a.phase==='work'){
        const len=curBlockMs(a); if(now-st<len) break;
        const end=new Date(st+len).toISOString();
        data.sessions.push({mat:a.mat, start:a.start, end, ...(a.sim?{sim:true}:{})});   // bloc complet : toujours noté, même court (dernier bloc)
        a.workDone+=len; a.blocks++; a.start=end; a.lastEnd=end;
        a.phase=(a.goal && a.workDone>=a.goal) ? 'done' : 'break'; changed=true;
      } else if(a.phase==='break'){
        if(now-st<POMO_BREAK_MS) break;
        a.phase='ready'; a.start=new Date(st+POMO_BREAK_MS).toISOString(); changed=true;
      } else break;   // 'ready' / 'done' : on attend un clic
    }
  } else if(a.goal && !a.reached && now-Date.parse(a.start)>=a.goal){ a.reached=true; changed=true; }
  if(changed) save();
  return changed;
}
// Pomodoro : relance un bloc après la pause (durée modifiable à chaque fois).
function setNextBlock(min){ if(!data.active) return; data.active.block=min; save(); refreshFocus(); }
function pomoGo(){
  const a=data.active; if(!a || a.mode!=='pomo') return;
  a.phase='work'; a.start=new Date().toISOString();
  primeSessBell(); save(); refreshFocus();
}
// Objectif atteint → on continue sans objectif (chrono libre : le chrono continue ; Pomodoro : choix du prochain bloc).
function continueSession(){
  const a=data.active; if(!a) return;
  a.goal=null; delete a.reached;
  if(a.mode==='pomo'){ a.phase='ready'; a.start=new Date().toISOString(); }
  save(); refreshFocus();
}
const MIN_SESSION_MS = 10*60000;   // < 10 min = pas assez significatif pour être noté, on ignore
// Une session > MAX_SESSION_H (page laissée ouverte par oubli) n'est jamais enregistrée sans confirmation
// explicite — au lieu de faire confiance à « Terminer » comme avant (qui laissait passer des durées absurdes,
// ex : 9h de maths pour une page oubliée ouverte). pendingLongSession porte la session en attente de décision.
let pendingLongSession=null;
function stopSession(){
  if(!data.active) return;
  const s=data.active;
  if(s.mode==='pomo'){
    advanceSession();   // un bloc fini entre deux ticks est enregistré entier, pas tronqué
    let end=s.lastEnd||s.start, rec=s.blocks>0;   // hors bloc (pause/prêt/terminé) : fin = fin du dernier bloc, pas l'attente
    if(s.phase==='work'){   // bloc interrompu : même règle qu'un chrono libre (≥ 10 min pour compter)
      end=new Date().toISOString();
      if(Date.parse(end)-Date.parse(s.start)>=MIN_SESSION_MS){ data.sessions.push({mat:s.mat, start:s.start, end, ...(s.sim?{sim:true}:{})}); rec=true; }
    }
    finishActive(end, rec); return;   // pause / prêt / terminé : les blocs sont déjà notés
  }
  const end=new Date().toISOString(), ms=Date.parse(end)-Date.parse(s.start);
  if(ms>MAX_SESSION_MS){ pendingLongSession={s,end}; openLongSessionModal(ms); return; }
  if(ms>=MIN_SESSION_MS) data.sessions.push({mat:s.mat, start:s.start, end, ...(s.sim?{sim:true}:{})});
  finishActive(end, ms>=MIN_SESSION_MS);   // masque le mode focus + bilan
}
function openLongSessionModal(ms){

function submitLongSessionEdit(){

function resolveLongSession(action, ms){
  if(!pendingLongSession) return;
  const {s,end}=pendingLongSession;
  const m=document.getElementById('modal'); m.classList.add('hidden'); m.innerHTML='';
  let realEnd=end, rec=false;
  if(action!=='discard'){
    const dur = action==='set' ? ms : (Date.parse(end)-Date.parse(s.start));
    realEnd = action==='set' ? new Date(Date.parse(s.start)+dur).toISOString() : end;
    if(dur>=MIN_SESSION_MS){ data.sessions.push({mat:s.mat, start:s.start, end:realEnd, ...(s.sim?{sim:true}:{})}); rec=true; }
  }

// ---- Bilan de fin de session : ressenti (❌ / 〰️ / ✅) + ce qui a été fait parmi les tâches prévues ----
let debrief=null;   // {mat,start,end,mood,plan} en attente de validation
// Bilan à chaque « Terminer » (sauf « Ne pas enregistrer ») ; recorded = la session compte dans les stats (≥ 10 min).
function finishActive(end, recorded){
  const a=data.active;
  data.active=null; save(); flushSync(); render();   // render() masque le mode focus
  if(!a || recorded==='discard') return;
  const st=a.began||a.start, fin=end||new Date().toISOString(), t0=Date.parse(st);
  // temps vraiment travaillé (blocs/session enregistrés depuis le début ; à défaut, fin − début)
  const real=(data.sessions||[]).filter(x=>x.end && x.mat===a.mat && Date.parse(x.start)>=t0-1000).reduce((s,x)=>s+Math.max(0,Date.parse(x.end)-Date.parse(x.start)),0) || Math.max(0,Date.parse(fin)-t0);
  if(a.task){ const t=(data.todos||[]).find(x=>x.id===a.task); if(t){ t.spent=(t.spent||0)+Math.round(real/60000); save(); } }
  openDebrief({mat:a.mat, start:st, end:fin, mood:null, recorded:!!recorded, ...(a.sim?{sim:true}:{}),
    ...(a.task?{task:a.task, est:a.est, real:Math.round(real/60000)}:{}),
    plan:(a.plan||[]).map(p=>({txt:p.txt, done:!!p.done}))});
}
// Vague « moyen » dessinée en SVG (l'emoji 〰️ s'affichait comme un trait fin gris) : carré orange façon ✅.
const WAVE_ICON='<span class="wavebadge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 13.5c1.9-3.6 5.6-3.6 7.5 0s5.6 3.6 7.5 0"/></svg></span>';
const MOODS=[['ko','❌','Pas top'],['mid',WAVE_ICON,'Bof'],['ok','✅','Réussie']];
function openDebrief(d){ debrief=d; d._ar=arenasOn()?debriefArena(d):null; paintDebrief(); }
// Bilan : la barre de l'arène monte en direct avec le temps de la session (« +45 min · plus que 1 h 15 avant le prochain élément »).
function debriefArena(d){
  const i=arenaIdx(), A=ARENAS[i], t0=Date.parse(d.start);
  // temps réellement enregistré depuis le début de la session (en Pomodoro : tous les blocs comptés)
  const gained=(data.sessions||[]).filter(x=>x.end && !x.sim && Date.parse(x.start)>=t0-1000).reduce((s,x)=>s+Math.max(0,Date.parse(x.end)-Math.max(ARENA_FROM,Date.parse(x.start))),0)/3600000;
  const H=totalWorkH(), pos=h=>Math.max(0,Math.min(10,(h-arenaStart(i))/A.d*10));
  return {i, from:pos(H-gained), to:pos(H), gained, H, mat:d.mat, done:false};
}
// Après le bilan : grande colonne d'énergie qui monte vers la carte « ??? » du prochain élément.
// La colonne = le trajet jusqu'au PROCHAIN élément (45 min sur 2 h = un gros tiers qui monte). Plus elle monte, plus la carte
// brille et tremble ; si elle l'atteint : explosion, « Nouvel élément ! », et la vraie carte se retourne juste après.
// Fin : « encore N sessions comme celle-là » + bouton « Relancer une session » (donner envie d'en refaire une).
function openGauge(r){
  if(!r || !(r.gained>0) || !arenasOn() || document.querySelector('.argauge') || r.from>=10-1e-9) return;   // arène déjà complète : rien à remplir (le portail attend sur l'Accueil)
  const A=ARENAS[r.i], last=r.i===ARENAS.length-1, per=A.d/10*3600000;
  const S0=Math.floor(r.from+1e-9), S1=Math.min(10,Math.floor(r.to+1e-9)), crossed=S1-S0;
  const leftMs=Math.max(0,(arenaStart(r.i)+(S1+1)*A.d/10-r.H)*3600000), gMs=r.gained*3600000;
  const w=document.createElement('div'); w.className='argauge'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
  w.setAttribute('aria-label',`${A.nom} : +${fmtDur(gMs)}`); w.style.setProperty('--c',A.wc);

// ---- Affichage du chrono (cosmétique : la durée réelle reste fin − début) ----
function clock(ms){ const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,
  p=n=>String(n).padStart(2,'0'); return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`; }

    const ph=document.getElementById('rphase');

      const tot=a.goal ? a.blocks+Math.ceil((a.goal-a.workDone)/(a.block*60000)) : 0;
      if(ph) ph.textContent='Travail · bloc '+(a.blocks+1)+(tot?' sur '+tot:'');
    } else if(a.phase==='break'){ shown=clock(POMO_BREAK_MS-(now-st)); done=a.workDone; if(ph) ph.textContent='Pause'; }
    else done=a.workDone;

}

// ---- Agrégation par période ----
function fmtDur(ms){
  if(ms<=0) return '0 min';
  const sec=Math.round(ms/1000); if(sec<60) return sec+' s';   // < 1 min → secondes (façon « temps d'écran »)
  const min=Math.round(ms/60000); if(min<60) return min+' min';
  const h=Math.floor(min/60),m=min%60; return m?`${h} h ${String(m).padStart(2,'0')}`:`${h} h`;
}
// Fenêtre affichée [start,end) selon période + décalage : jour = 1 journée ;
// semaine = lundi→dimanche. periodOffset recule (−1 = précédente) ; jamais dans le futur.
function periodWindow(){
  const d=new Date(); d.setHours(0,0,0,0);
  if(period==='jour'){ d.setDate(d.getDate()+periodOffset); const start=d.getTime(); return {start, end:addDays(start,1)}; }
  const wd=(d.getDay()+6)%7;                 // 0 = lundi
  d.setDate(d.getDate()-wd + periodOffset*7); // lundi de la semaine cible
  const start=d.getTime(); return {start, end:addDays(start,7)};
}
function sessionsInPeriod(){ const {start,end}=periodWindow();
  return (data.sessions||[]).filter(s=>{ const t=Date.parse(s.start); return s.end && t>=start && t<end; }); }
function matTotals(){
  const tot={};
  sessionsInPeriod().forEach(s=>{ const d=Date.parse(s.end)-Date.parse(s.start); if(d>0) tot[s.mat]=(tot[s.mat]||0)+d; });
  return tot;
}
// Libellé de la fenêtre courante (façon « Aujourd'hui, … » / « Semaine dernière »).
function windowLabel(){
  const {start}=periodWindow();
  if(period==='jour'){
    if(periodOffset===0) return "Aujourd'hui";
    if(periodOffset===-1) return "Hier";
    return new Date(start).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  }
  if(periodOffset===0) return "Cette semaine";
  if(periodOffset===-1) return "Semaine dernière";
  const a=new Date(start), b=new Date(addDays(start,6));
  return `${a.getDate()} – ${b.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;
}
// Comme « temps d'écran » : tranches (24 heures pour le jour, 7 jours lundi→dimanche pour la semaine),
// chaque tranche cumulée par matière (→ empilage coloré). tipOf = libellé d'infobulle.
function timeBuckets(){
  const {start}=periodWindow();
  let n, idxOf, labelOf, tipOf;
  if(period==='jour'){
    n=24;
    idxOf=t=> new Date(t).getHours();
    labelOf=i=> i%6===0 ? i+'h' : '';
    tipOf=i=> `${i}h–${i+1}h`;
  } else {
    n=7; const WD=['L','M','M','J','V','S','D'];   // start = lundi
    idxOf=t=>{ const d=new Date(t); d.setHours(0,0,0,0); return Math.round((d-start)/86400000); };
    labelOf=i=> WD[i];
    tipOf=i=> new Date(addDays(start,i)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'});
  }
  const buckets=Array.from({length:n},()=>({total:0,byMat:{}}));
  sessionsInPeriod().forEach(s=>{ const k=idxOf(Date.parse(s.start)); if(k<0||k>=n) return;
    const d=Date.parse(s.end)-Date.parse(s.start); if(d<=0) return;
    buckets[k].total+=d; buckets[k].byMat[s.mat]=(buckets[k].byMat[s.mat]||0)+d; });
  return {buckets, labelOf, tipOf};
}
// Axe Y « joli » : un pas rond donnant ~3-4 graduations au-dessus du max (en minutes).
function niceAxis(maxMin){
  const steps=[10,15,20,30,60,90,120,180,240,360,480,600,720];
  let step=steps[steps.length-1];
  for(const s of steps){ if(maxMin/s<=4){ step=s; break; } }
  return {max:Math.max(step, Math.ceil(maxMin/step)*step), step};
}
function axisLab(min){ if(min<60) return min+'min'; const h=Math.floor(min/60),m=min%60; return m?`${h}h${m}`:`${h}h`; }
// Graphe SVG : barres empilées par tranche de temps + grille + axe à droite + ligne de moyenne.
function barChartSVG(avgMin){
  const {buckets,labelOf,tipOf}=timeBuckets();
  const W=600,H=232,padL=6,padR=42,padT=12,padB=22,plotW=W-padL-padR,plotH=H-padT-padB;
  const maxMin=Math.max(...buckets.map(b=>b.total))/60000;
  if(maxMin<=0) return `<p class="chartempty">Aucune session sur cette période. Lance-toi !</p>`;
  const {max:axMax,step}=niceAxis(maxMin);
  const Y=min=> padT+(1-min/axMax)*plotH;
  let grid='';
  for(let v=0; v<=axMax+0.001; v+=step){ const y=Y(v).toFixed(1);
    grid+=`<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" class="cg"${v===0?'':' opacity="0.5"'}/>`;
    grid+=`<text x="${padL+plotW+5}" y="${(+y+3.5).toFixed(1)}" class="cay">${axisLab(v)}</text>`;
  }
  let avg='';
  if(avgMin>0 && avgMin<=axMax){ const y=Y(avgMin).toFixed(1);
    avg=`<line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" class="cavg"/>`
       +`<text x="${padL+plotW+5}" y="${(+y+3.5).toFixed(1)}" class="cay" style="fill:var(--ink)">moy.</text>`;
  }
  // Vue semaine : chaque tranche = 1 jour cliquable (sauf le futur).
  const week=period==='semaine', {start:winStart}=periodWindow();
  const todayMid=(()=>{ const d=new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
  const dayClickable=i=> week && addDays(winStart,i)<=todayMid;
  const n=buckets.length, slot=plotW/n, bw=Math.min(slot*0.62, period==='semaine'?30:slot*0.72);
  let bars='', hits='';
  buckets.forEach((b,i)=>{
    const cx=padL+(i+0.5)*slot, x=(cx-bw/2).toFixed(1), clik=dayClickable(i);
    if(clik) hits+=`<rect x="${(padL+i*slot).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${(H-padT-2).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="drillDay(${i})"><title>${escapeH(tipOf(i))} · voir le détail</title></rect>`;
    if(b.total>0){
      let y=padT+plotH, segs='';
      data.matieres.forEach(m=>{ const v=b.byMat[m.id]; if(!v) return;
        const h=v/60000/axMax*plotH; y-=h;
        segs+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5,h).toFixed(1)}" fill="${m.color}"/>`;
      });
      bars+=`<g${clik?` style="cursor:pointer" onclick="drillDay(${i})"`:''}><title>${escapeH(tipOf(i))} · ${fmtDur(b.total)}</title>${segs}</g>`;
    }

  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chartsvg timesvg">${grid}${avg}${hits}${bars}</svg>`;
}

// Au chargement : une session laissée ouverte depuis > MAX_SESSION_H est présumée oubliée → on l'annule (non comptée).
function recoverStaleSession(){
  const a=data.active;
  if(otherDevice(a)) return;   // pilotée par un autre appareil : c'est lui qui la fait avancer ou la clôt
  if(a && a.mode==='pomo'){
    advanceSession();   // blocs finis pendant l'absence : enregistrés à leur vraie heure de fin
    // en attente d'un clic depuis des heures (pause finie / objectif atteint) : rien à perdre, on clôt sans bruit
    if(a.phase!=='work' && Date.now()-Date.parse(a.start) > MAX_SESSION_MS){ data.active=null; save(); }
    return;
  }
  if(data.active && Date.now()-Date.parse(data.active.start) > MAX_SESSION_MS){
    data.active=null; staleRecovered=true; save();
  }
}
const GOAL_OPTS = [25,30,60,90,120,180];   // objectifs proposés (minutes) ; « Autre » pour le reste
const POMO_OPTS = [20,25,30,45];        // durées de bloc Pomodoro (minutes)
const POMO_COUNTS = [1,2,3,4,5,6];        // nombres de pomodoros proposés
function pickerCard(noAnim){
  const chips=data.matieres.map(m=>`<button class="matchip${armed===m.id?' on':''}" style="--c:${m.color}" onclick="armMat('${m.id}')">
      <span class="dot"></span>${escapeH(m.nom)}</button>`).join('');
  const custom = goalMin && !GOAL_OPTS.includes(goalMin);
  const goals=GOAL_OPTS.map(g=>`<button class="optchip${goalMin===g?' on':''}" onclick="setGoal(${g})">${fmtDur(g*60000)}</button>`).join('')
    + `<button class="optchip${custom?' on':''}" onclick="openGoalCustom()">${custom?fmtDur(goalMin*60000):'Autre'}</button>`;
  const modes=[['libre','Chrono simple'],['pomo','Pomodoro']].map(([k,l])=>
    `<button class="segb${sessMode===k?' on':''}" onclick="setSessMode('${k}')">${l}</button>`).join('');
  const counts=POMO_COUNTS.map(n=>`<button class="optchip${pomoCount===n?' on':''}" onclick="setPomoCount(${n})">${n}</button>`).join('');
  // Pomodoro : on choisit un nombre de pomodoros (+ leur durée) ; chrono libre : une durée d'objectif.
  let goalBlock = sessMode==='pomo'
    ? `<div class="sesslbl">Combien de pomodoros ?</div>
       <div class="optchips">${counts}</div>
       <div class="sesslbl">Durée d'un pomodoro</div>
       <div class="optchips">${POMO_OPTS.map(b=>`<button class="optchip${pomoMin===b?' on':''}" onclick="setPomoMin(${b})">${b} min</button>`).join('')}</div>
       <p class="sesshint">${pomoCount?`${fmtDur((pomoCount*pomoMin+(pomoCount-1)*5)*60000)}${pomoCount>1?', pauses comprises':''}`:'Des blocs de travail, avec 5 min de pause entre chaque.'}</p>`
    : `<div class="sesslbl">Combien de temps veux-tu travailler ?</div>
       <div class="optchips">${goals}</div>`;
  const pt=pendingTask&&(data.todos||[]).find(x=>x.id===pendingTask);
  if(taskGoal){   // tâche avec temps estimé : l'objectif est déjà là
    let hint=`Le chrono s'arrête à ${fmtDur(taskGoal*60000)}, tu pourras continuer si tu veux.`;
    if(sessMode==='pomo'){ const b=Math.min(pomoMin,taskGoal), n=Math.ceil(taskGoal/b-1e-9), last=taskGoal-(n-1)*b;
      hint = n===1 ? `1 bloc de ${fmtDur(taskGoal*60000)}` : `${n} blocs de ${b} min${last<b?` (le dernier de ${last} min)`:''} · ${fmtDur((taskGoal+(n-1)*5)*60000)}, pauses comprises`; }
    goalBlock = `<div class="sesslbl">${pt&&pt.spent&&pt.est&&taskGoal<pt.est?'Temps restant estimé':'Temps estimé de la tâche'}</div>
      <div class="optchips"><button class="optchip on">${fmtDur(taskGoal*60000)}</button><button class="optchip" onclick="clearTaskGoal()">Changer</button></div>
      ${sessMode==='pomo'?`<div class="sesslbl">Durée d'un pomodoro</div><div class="optchips">${POMO_OPTS.map(b=>`<button class="optchip${pomoMin===b?' on':''}" onclick="setPomoMin(${b})">${b} min</button>`).join('')}</div>`:''}
      <p class="sesshint">${hint}</p>`;
  }
  const ready = armed && goalReady();
  const lbl = !armed ? 'Choisis une matière' : !goalReady() ? (sessMode==='pomo'?'Choisis le nombre de pomodoros':'Choisis un objectif') : 'Travailler';
  return `<div class="sessionwrap withag"><div class="card sessioncard${noAnim?' noanim':''}">
    <div class="sesshead">${ic('clock',30)}
      <h2>On s'y met ?</h2>
      <p>Choisis une matière et ton objectif, puis lance le chrono.</p></div>
    <div class="matchips">${chips}</div>
    ${pt?`<p class="sesstask">${ic('list',15)}<span>Tâche : <b>${escapeH(pt.named||!pt.steps?pt.txt:sessPlan.join(', '))}</b></span></p>`:''}
    <div class="sessseg"><div class="seg">${modes}</div></div>
    ${goalBlock}
    <button class="bigbtn bigwork" ${ready?'':'disabled'} onclick="openPlan('work')">${ic('play',20)}<span>${lbl}</span></button>
    <button class="bigbtn bigbreathe" onclick="${ready?"openPlan('breathe')":'openBreathe(5)'}">${ic('breath',20)}<span>${ready?'Respirer puis travailler':'Respirer 5 min'}</span></button>

}
